<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>ZENTRO</title>\n<link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n<body>\n<main>\n  <div class=\"card\">\n    <div class=\"logo\">Z</div>\n    <h1>ZENTRO</h1>\n    <p>بوت اقتصاد لديسكورد: اجمع ZC، احفظها في البنك، وحوّلها لأصدقائك.</p>\n\n    <button id=\"login\">تسجيل الدخول بـ Discord</button>\n    <a id=\"invite\" target=\"_blank\" rel=\"noopener\">إضافة البوت للسيرفر</a>\n\n    <div class=\"stats\">\n      <div><b id=\"guilds\">—</b><span>سيرفر</span></div>\n      <div><b id=\"users\">—</b><span>عضو</span></div>\n      <div><b id=\"coins\">—</b><span>ZC</span></div>\n    </div>\n  </div>\n</main>\n\n<script src=\"config.js\"></script>\n<script>\nconst c = window.ZENTRO_CONFIG;\ninvite.href = c.INVITE_URL;\nlogin.onclick = () => location.href = 'https://discord.com/oauth2/authorize?client_id=' + c.DISCORD_CLIENT_ID + '&redirect_uri=' + encodeURIComponent(c.REDIRECT_URI) + '&response_type=token&scope=identify';\nfetch(c.API_BASE + '/api/stats').then(r => r.json()).then(s => { guilds.textContent = s.guilds; users.textContent = s.users; coins.textContent = s.totalCoins; }).catch(() => {});\n</script>\n</body>\n</html>
