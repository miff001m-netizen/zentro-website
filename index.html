<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>ZENTRO</title>\n<link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n<body>\n<main>\n  <div class=\"logo\">Z</div>\n  <h1>ZENTRO</h1>\n  <p>اجمع ZC، احفظها في البنك، وحوّلها لأصحابك.</p>\n\n  <button id=\"login\" class=\"btn\">تسجيل الدخول بـ Discord</button>\n  <a id=\"invite\" class=\"btn ghost\" target=\"_blank\" rel=\"noopener\">إضافة البوت للسيرفر</a>\n\n  <div class=\"stats\">\n    <div><span>السيرفرات</span><b id=\"guilds\">—</b></div>\n    <div><span>الأعضاء</span><b id=\"users\">—</b></div>\n    <div><span>إجمالي ZC</span><b id=\"coins\">—</b></div>\n  </div>\n</main>\n\n<script src=\"config.js\"></script>\n<script>\nconst c = window.ZENTRO_CONFIG;\ndocument.getElementById('invite').href = c.INVITE_URL;\n\ndocument.getElementById('login').onclick = () => {\n  location.href = 'https://discord.com/oauth2/authorize?client_id=' + c.DISCORD_CLIENT_ID +\n    '&redirect_uri=' + encodeURIComponent(c.REDIRECT_URI) +\n    '&response_type=token&scope=identify';\n};\n\nfetch(c.API_BASE + '/api/stats')\n  .then(r => r.json())\n  .then(s => {\n    guilds.textContent = s.guilds.toLocaleString();\n    users.textContent = s.users.toLocaleString();\n    coins.textContent = s.totalCoins.toLocaleString();\n  })\n  .catch(() => {});\n</script>\n</body>\n</html>
