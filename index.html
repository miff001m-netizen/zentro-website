<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZENTRO | الرئيسية</title>
<style>
:root{--bg:#050507;--surface:#0b0b0e;--surface-2:#131317;--line:#1c1c1f;--text:#f5f5f7;--muted:#8a8a93;--gold:#d4af37;--teal:#14b8a6;--green:#22c55e;--red:#f43f5e}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}.glow{position:fixed;top:-210px;left:50%;width:760px;height:760px;transform:translateX(-50%);background:radial-gradient(circle,rgba(20,184,166,.15),transparent 62%);filter:blur(54px);pointer-events:none}.glow2{position:fixed;bottom:-250px;right:-160px;width:590px;height:590px;background:radial-gradient(circle,rgba(212,175,55,.10),transparent 62%);filter:blur(62px);pointer-events:none}.wrap{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;position:relative}.card{background:rgba(11,11,14,.91);border:1px solid var(--line);border-radius:24px;padding:48px 36px;max-width:520px;width:100%;backdrop-filter:blur(10px)}.coin{width:78px;height:78px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:var(--gold);background:radial-gradient(circle at 30% 30%,#1a1a1d,#0b0b0d);border:1px solid rgba(212,175,55,.45);box-shadow:0 0 30px rgba(212,175,55,.15)}.logo{font-weight:900;letter-spacing:2px;margin-bottom:16px}.logo span{color:var(--gold)}h1{font-size:30px;margin-bottom:10px}h1 span{color:var(--gold)}p{color:var(--muted);font-size:15px;line-height:1.8;margin-bottom:26px}.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.btn{display:inline-block;padding:15px 26px;border-radius:14px;background:#5865f2;color:#fff;text-decoration:none;font-weight:900;transition:.2s;border:0;cursor:pointer}.btn:hover{transform:translateY(-2px)}.btn.ghost{background:var(--surface-2);border:1px solid var(--line);color:var(--text)}.tags{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:26px}.tags span{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);padding:8px 14px;border-radius:999px;font-size:12px}@media(max-width:480px){h1{font-size:23px}.card{padding:34px 22px}}
</style>
</head>
<body>
<div class="glow"></div><div class="glow2"></div>
<div class="wrap"><div class="card"><div class="coin">ZC</div><div class="logo">ZENTRO<span> COIN</span></div><h1>إدارة <span>ZC</span> بسهولة</h1><p>سجّل الدخول لعرض رصيدك، وإدارة محفظتك وبنكك، واستلام مكافأتك اليومية.</p><div class="row"><a class="btn" href="/auth/login">تسجيل الدخول عبر Discord</a><a class="btn ghost" href="/profile.html">لوحة العضو</a><a class="btn ghost" href="/wallet.html">المحفظة والبنك</a></div><div class="tags"><span>محفظة</span><span>بنك</span><span>مكافأة يومية</span><span>تحويلات</span></div></div></div>
</body>
</html>
