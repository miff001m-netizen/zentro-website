<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8f6f1"><title>ZENTRO — لوحتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="dashboard.css">
</head><body>
<header class="dash-top"><a class="brand" href="index.html"><span class="brand-mark">Z</span><span>ZENTRO</span></a><div class="user-chip"><img id="user-avatar" src="" alt=""><span id="user-name">زائر</span><button id="logout" class="ghost-button">خروج</button></div></header>
<main class="dash wrap">
<section class="welcome"><div><p class="eyebrow">أهلًا بيك</p><h1>لوحتك في ZENTRO</h1><p class="muted">تابع رصيدك، استلم مكافأتك، وحوّل ZC لأصدقائك.</p></div><div class="coin-mini"><span>Z</span></div></section>
<nav class="tabs"><button class="tab active" data-tab="overview">الرصيد</button><button class="tab" data-tab="daily">المكافأة</button><button class="tab" data-tab="transfer">تحويل</button><button class="tab" data-tab="history">السجل</button><button class="tab" data-tab="top">التوب</button><button class="tab" data-tab="profile">ملفي</button></nav>
<section id="overview" class="panel active"><div class="cards"><article class="stat-card"><span>رصيد المحفظة</span><strong id="wallet">0</strong><small>ZC</small></article><article class="stat-card"><span>رصيد البنك</span><strong id="bank">0</strong><small>ZC</small></article><article class="stat-card"><span>الإجمالي</span><strong id="total">0</strong><small>ZC</small></article></div><div class="bank-actions"><button id="deposit" class="primary-button">إيداع في البنك</button><button id="withdraw" class="ghost-button">سحب من البنك</button></div></section>
<section id="daily" class="panel"><div class="daily-card"><div><h2>المكافأة اليومية</h2><p class="muted">استلم مكافأتك اليومية وحافظ على سلسلتك.</p></div><button id="claim-daily" class="primary-button">استلم المكافأة</button><p id="daily-status" class="muted">متاحة الآن</p></div></section>
<section id="transfer" class="panel"><div class="form-card"><h2>تحويل ZC</h2><label>اسم المستخدم أو ID</label><input id="transfer-user" placeholder="مثال: username أو 123456789"><label>عدد ZC</label><input id="transfer-amount" type="number" min="1" value="100"><button id="send-transfer" class="primary-button">تأكيد التحويل</button><p id="transfer-status" class="muted"></p></div></section>
<section id="history" class="panel"><div class="list-card"><h2>سجل التحويلات</h2><ul id="history-list" class="history"></ul></div></section>
<section id="top" class="panel"><div class="list-card"><h2>لوحة الأوائل</h2><ol id="top-list" class="top"></ol></div></section>
<section id="profile" class="panel"><div class="profile-card"><img id="profile-avatar" src="" alt=""><div><h2 id="profile-name">زائر</h2><p class="muted" id="profile-id">لم يتم تسجيل الدخول</p></div></div></section>
</main><script src="dashboard.js"></script></body></html>
