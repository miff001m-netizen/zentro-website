<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZENTRO COIN</title>
<style>
:root{--bg:#0b0b0f;--card:#15151d;--gold:#f1c40f;--text:#f5f5f5;--muted:#a0a0b0;--border:#2a2a36}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:40px 28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.logo{font-size:28px;font-weight:900;letter-spacing:1px}
.logo span{color:var(--gold)}
.sub{color:var(--muted);margin:10px 0 30px;font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border-radius:12px;font-weight:800;font-size:16px;text-decoration:none;transition:.2s;border:1px solid transparent}
.btn+.btn{margin-top:14px}
.btn-gold{background:var(--gold);color:#111}
.btn-gold:hover{filter:brightness(1.1)}
.btn-dark{background:#1c1c26;color:var(--text);border-color:var(--border)}
.btn-dark:hover{border-color:var(--gold);color:var(--gold)}
.footer{margin-top:26px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">ZENTRO <span>COIN</span></div>
  <p class="sub">سجّل الدخول أو أضف البوت إلى سيرفرك</p>
  <a class="btn btn-gold" href="/auth/login">تسجيل الدخول عبر Discord</a>
  <a class="btn btn-dark" href="https://discord.com/oauth2/authorize?client_id=1422476106216849499&permissions=8&scope=bot%20applications.commands">إضافة البوت للسيرفر</a>
  <div class="footer">© ZENTRO COIN</div>
</div>
</body>
</html>
