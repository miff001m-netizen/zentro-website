<!DOCTYPE html><html lang='ar' dir='rtl'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>ZENTRO | لوحة العضو</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,'Segoe UI',Tahoma,sans-serif;background:#050507;color:#F5F5F7;min-height:100vh}.login{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.card{background:#0B0B0E;border:1px solid #1C1C1F;border-radius:24px;padding:48px 36px;max-width:420px;width:100%}.coin{width:72px;height:72px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#D4AF37;background:radial-gradient(circle at 30% 30%,#1a1a1d,#0b0b0d);border:1px solid rgba(212,175,55,.45)}.logo{font-weight:900;letter-spacing:2px;margin-bottom:18px}.logo span{color:#D4AF37}h1{font-size:26px;margin-bottom:10px}p{color:#8A8A93;font-size:15px;line-height:1.8;margin-bottom:28px}.btn{display:inline-block;padding:15px 30px;border-radius:14px;background:#5865F2;color:#fff;text-decoration:none;font-weight:900}.app{display:none;max-width:1100px;margin:0 auto;padding:32px 20px}.hero{display:flex;align-items:center;gap:18px;background:#0B0B0E;border:1px solid #1C1C1F;border-radius:22px;padding:26px;margin-bottom:24px;flex-wrap:wrap}.hero img{width:72px;height:72px;border-radius:50%;border:2px solid rgba(212,175,55,.4)}.hero h1{font-size:24px;margin-bottom:6px}.hero small{color:#8A8A93;display:flex;align-items:center;gap:8px}.copy{background:#131317;border:1px solid #1C1C1F;color:#8A8A93;border:none;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}.stat{background:#0B0B0E;border:1px solid #1C1C1F;border-radius:18px;padding:22px}.stat small{color:#8A8A93;font-size:13px}.stat b{display:block;font-size:26px;margin-top:8px}.gold{color:#D4AF37}.teal{color:#14B8A6}.panel{background:#0B0B0E;border:1px solid #1C1C1F;border-radius:18px;padding:24px;margin-bottom:24px}.panel h2{font-size:18px;margin-bottom:16px}.bar{height:10px;background:#131317;border-radius:999px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#14B8A6,#D4AF37);width:0%}.tx{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #1C1C1F;font-size:14px}.tx:last-child{border:none}.tag{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}.in{background:rgba(20,184,166,.15);color:#14B8A6}.out{background:rgba(244,63,94,.15);color:#F43F5E}.muted{color:#8A8A93;font-size:12px}@media(max-width:640px){.hero{flex-direction:column;text-align:center}}</style></head><body><div class='login' id='login'><div class='card'><div class='coin'>ZC</div><div class='logo'>ZENTRO<span> COIN</span></div><h1>لوحة العضو</h1><p>سجّل الدخول عبر ديسكورد لعرض رصيدك وتحويلاتك.</p><a class='btn' href='/auth/login'>تسجيل الدخول عبر Discord</a></div></div><div class='app' id='app'><div class='hero'><img id='avatar' src='' alt=''><div><h1>أهلاً <span id='username' class='gold'></span></h1><small>ID: <span id='uid'></span> <button class='copy' onclick='copyId()'>نسخ</button></small></div></div><div class='grid'><div class='stat'><small>المحفظة</small><b id='wallet' class='teal'>—</b></div><div class='stat'><small>البنك</small><b id='bank'>—</b></div><div class='stat'><small>الإجمالي</small><b id='total' class='gold'>—</b></div></div><div class='grid'><div class='stat'><small>تحويلات أرسلتها</small><b id='sent'>—</b></div><div class='stat'><small>تحويلات استلمتها</small><b id='received'>—</b></div><div class='stat'><small>إجمالي التحويلات</small><b id='txcount'>—</b></div></div><div class='panel'><h2>المستوى والخبرة</h2><p style='color:#8A8A93;font-size:14px'>المستوى <b id='level' class='gold'>1</b> — <span id='xptext'></span></p><div class='bar'><i id='xpbar'></i></div></div><div class='panel'><h2>المكافأة اليومية</h2><p id='dailystatus' style='color:#8A8A93;font-size:14px'></p></div><div class='panel'><h2>آخر 5 تحويلات</h2><div id='txlist'></div></div></div><script>function copyId(){navigator.clipboard.writeText(document.getElementById('uid').textContent)}fetch('/api/me').then(r=>r.json()).then(d=>{if(d.guest||!d.user){document.getElementById('login').style.display='grid';document.getElementById('app').style.display='none';return}const u=d.user;document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('username').textContent=u.username||'عضو';document.getElementById('uid').textContent=u.discord_id;if(u.avatar)document.getElementById('avatar').src=u.avatar;document.getElementById('wallet').textContent=(u.wallet||0).toLocaleString()+' ZC';document.getElementById('bank').textContent=(u.bank||0).toLocaleString()+' ZC';document.getElementById('total').textContent=(d.total||0).toLocaleString()+' ZC';document.getElementById('sent').textContent=d.sentCount||0;document.getElementById('received').textContent=d.receivedCount||0;document.getElementById('txcount').textContent=d.totalTransactions||0;document.getElementById('level').textContent=u.level||1;const xp=u.xp||0;const into=xp%100;document.getElementById('xptext').textContent=xp.toLocaleString()+' XP — ناقصك '+(100-into)+' XP للمستوى الجاي';document.getElementById('xpbar').style.width=into+'%';document.getElementById('dailystatus').textContent=d.canDaily?'مكافأتك اليومية متاحة — استلمها من البوت داخل ديسكورد.':'استلمت مكافأتك اليومية، ارجع بكرة.';const list=document.getElementById('txlist');if(!d.transactions||!d.transactions.length){list.innerHTML='<p style="color:#8A8A93;font-size:14px">لا توجد تحويلات بعد.</p>'}else{list.innerHTML=d.transactions.slice(0,5).map(t=>{const out=t.sender===u.discord_id;const other=out?t.receiver:t.sender;return `<div class='tx'><div><b class='${out?'out':'in'}'>${out?'حوّلت إلى':'استلمت من'}</b> <span class='muted'>${other}</span><br><span class='muted'>${new Date(t.created_at).toLocaleString('ar-EG')}</span></div><b class='${out?'out':'in'}'>${out?'-':'+'}${t.amount.toLocaleString()} ZC</b></div>`}).join('')}}).catch(()=>{document.getElementById('login').style.display='grid';document.getElementById('app').style.display='none'})</script></body></html>
