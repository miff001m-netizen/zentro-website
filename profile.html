<!DOCTYPE html><html lang='ar' dir='rtl'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>ZENTRO | لوحة العضو</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,'Segoe UI',Tahoma,sans-serif;background:#050507;color:#F5F5F7;min-height:100vh}.login{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.card{background:#0B0B0E;border:1px solid #1C1C1F;border-radius:24px;padding:48px 36px;max-width:420px;width:100%}.coin{width:72px;height:72px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#D4AF37;background:radial-gradient(circle at 30% 30%,#1a1a1d,#0b0b0d);border:1px solid rgba(212,175,55,.45)}.logo{font-weight:900;letter-spacing:2px;margin-bottom:18px}.logo span{color:#D4AF37}h1{font-size:26px;margin-bottom:10px}p{color:#8A8A93;font-size:15px;line-height:1.8;margin-bottom:28px}.btn{display:inline-block;padding:15px 30px;border-radius:14px;background:#5865F2;color:#fff;text-decoration:none;font-weight:900}.app{display:none}.topbar{display:flex;align-items:center;gap:14px;padding:16px 20px;background:#0B0B0E;border-bottom:1px solid #1C1C1F;position:sticky;top:0;z-index:10}.burger{width:42px;height:42px;border-radius:12px;background:#131317;border:1px solid #1C1C1F;color:#F5F5F7;font-size:20px;cursor:pointer}.brand{font-weight:900;letter-spacing:2px}.brand span{color:#D4AF37}.sidebar{position:fixed;top:0;right:0;bottom:0;width:260px;background:#0B0B0E;border-left:1px solid #1C1C1F;padding:24px 16px;display:flex;flex-direction:column;gap:6px;transform:translateX(100%);transition:.25s;z-index:20}.sidebar.open{transform:translateX(0)}.sidebar .brand{margin-bottom:18px;padding:0 8px}.nav{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:12px;color:#8A8A93;text-decoration:none;font-weight:700;cursor:pointer}.nav:hover,.nav.active{background:#131317;color:#F5F5F7}.nav.active{color:#14B8A6}.soon{margin-right:auto;font-size:11px;color:#8A8A93;background:#131317;padding:2px 8px;border-radius:999px}.logout{margin-top:auto;color:#F43F5E;text-decoration:none;font-weight:700;padding:12px 16px;border-radius:12px;border:1px solid #1C1C1F;text-align:center}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:15}.overlay.show{display:block}.main{padding:24px 20px;max-width:1100px;margin:0 auto}.hero{display:flex;align-items:center;gap:18px;background:#0B0B0E;border:1px solid #1C1C1F;border-radius:22px;padding:26px;margin-bottom:20px;flex-wrap:wrap}.hero img{width:72px;height:72px;border-radius:50%;border:2px solid rgba(212,175,55,.4)}.hero h1{font-size:22px;margin-bottom:6px}.hero small{color:#8A8A93;display:flex;align-items:center;gap:8px;font-size:13px}.copy{background:#131317;border:1px solid #1C1C1F;color:#8A8A93;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12px}.rank{margin-right:auto;text-align:center;background:#131317;border:1px solid #1C1C1F;border-radius:16px;padding:14px 22px}.rank small{color:#8A8A93;font-size:12px;display:block}.rank b{font-size:30px;color:#D4AF37}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:20px}.stat{background:#0B0B0E;border:1px solid #1C1C1F;border-radius:18px;padding:20px}.stat small{color:#8A8A93;font-size:13px}.stat b{display:block;font-size:24px;margin-top:8px}.teal{color:#14B8A6}.gold{color:#D4AF37}.green{color:#22C55E}.red{color:#F43F5E}.split{display:flex;gap:10px;margin-top:10px;font-size:13px}.split div{flex:1;background:#131317;border-radius:10px;padding:8px;text-align:center}.panel{background:#0B0B0E;border:1px solid #1C1C1F;border-radius:18px;padding:20px}.panel h2{font-size:16px;margin-bottom:10px}.panel p{color:#8A8A93;font-size:14px;line-height:1.8}.bar{height:8px;background:#131317;border-radius:999px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#14B8A6,#D4AF37);width:0%}@media(max-width:640px){.hero{flex-direction:column;text-align:center}.rank{margin:0}}</style></head><body><div class='login' id='login'><div class='card'><div class='coin'>ZC</div><div class='logo'>ZENTRO<span> COIN</span></div><h1>لوحة العضو</h1><p>سجّل الدخول عبر ديسكورد لعرض رصيدك وتحويلاتك وترتيبك.</p><a class='btn' href='/auth/login'>تسجيل الدخول عبر Discord</a></div></div><div class='app' id='app'><div class='topbar'><button class='burger' onclick='toggleSidebar()'>☰</button><div class='brand'>ZENTRO<span> COIN</span></div></div><div class='overlay' id='overlay' onclick='toggleSidebar()'></div><aside class='sidebar' id='sidebar'><div class='brand'>ZENTRO<span> COIN</span></div><a class='nav active'>الرئيسية</a><a class='nav'>التحويلات <span class='soon'>قريبًا</span></a><a class='nav'>Top 100 <span class='soon'>قريبًا</span></a><a class='logout' href='/auth/logout'>تسجيل الخروج</a></aside><main class='main'><div class='hero'><img id='avatar' src='' alt=''><div><h1>أهلاً <span id='username' class='gold'></span></h1><small>ID: <span id='uid'></span> <button class='copy' onclick='copyId()'>نسخ</button></small></div><div class='rank'><small>ترتيبك</small><b id='rank' class='teal'>—</b></div></div><div class='grid'><div class='stat'><small>البنك</small><b id='bank'>—</b></div><div class='stat'><small>المحفظة</small><b id='wallet' class='teal'>—</b></div><div class='stat'><small>التحويلات</small><b id='txcount'>—</b><div class='split'><div class='green'>استلمت: <span id='received'>0</span></div><div class='red'>حوّلت: <span id='sent'>0</span></div></div></div><div class='stat'><small>المستوى</small><b id='level' class='gold'>1</b><div class='bar'><i id='xpbar'></i></div></div></div><div class='grid'><div class='stat'><small>المكافأة اليومية</small><b id='daily' class='teal'>—</b></div><div class='stat'><small>الإنجازات</small><b id='ach'>—</b></div><div class='stat'><small>آخر تحويل</small><b id='lasttx' class='gold'>—</b></div></div></main></div><script>function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('show')}function copyId(){navigator.clipboard.writeText(document.getElementById('uid').textContent)}fetch('/api/me').then(r=>r.json()).then(d=>{if(d.guest||!d.user){document.getElementById('login').style.display='grid';document.getElementById('app').style.display='none';return}const u=d.user;document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('username').textContent=u.username||'عضو';document.getElementById('uid').textContent=u.discord_id;if(u.avatar)document.getElementById('avatar').src=u.avatar;document.getElementById('rank').textContent='#'+(d.rank||'—');document.getElementById('bank').textContent=(u.bank||0).toLocaleString()+' ZC';document.getElementById('wallet').textContent=(u.wallet||0).toLocaleString()+' ZC';document.getElementById('txcount').textContent=(d.totalTransactions||0).toLocaleString();document.getElementById('sent').textContent=d.sentCount||0;document.getElementById('received').textContent=d.receivedCount||0;document.getElementById('level').textContent=u.level||1;const xp=u.xp||0;document.getElementById('xpbar').style.width=(xp%100)+'%';document.getElementById('daily').textContent=d.canDaily?'متاحة':'استلمتها';const unlocked=(d.achievements||[]).filter(a=>a.unlocked).length;document.getElementById('ach').textContent=unlocked+' / '+(d.achievements||[]).length;const t=(d.transactions||[])[0];document.getElementById('lasttx').textContent=t?((t.sender===u.discord_id?'-':'+')+t.amount.toLocaleString()+' ZC'):'لا يوجد'}).catch(()=>{document.getElementById('login').style.display='grid';document.getElementById('app').style.display='none'})</script></body></html>
