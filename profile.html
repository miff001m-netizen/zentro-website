<!DOCTYPE html><html lang='ar' dir='rtl'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>ZENTRO | لوحة العضو</title><link rel='stylesheet' href='dashboard.css'></head><body><div class='glow'></div><div class='container'><nav><div class='logo'>ZENTRO<span> COIN</span></div><div class='user'><img id='userAvatar' width='36' height='36'><span id='userName'>زائر</span><a class='btn small' href='/auth/login'>دخول</a></div></nav><section class='stats'><div class='card'><h3>المحفظة</h3><b id='wallet'>0 ZC</b></div><div class='card'><h3>البنك</h3><b id='bank'>0 ZC</b></div><div class='card'><h3>الإجمالي</h3><b id='total'>0 ZC</b></div><div class='card'><h3>Streak</h3><b id='streak'>0 يوم</b></div></section><section class='panel'><h3>المكافأة اليومية</h3><p>استلم 250 ZC يوميًا واحافظ على سلسلتك.</p><button id='dailyBtn' class='btn'>استلم 250 ZC</button></section><section class='panel'><h3>البنك</h3><div class='row'><button id='depositBtn' class='btn ghost'>إيداع 100</button><button id='withdrawBtn' class='btn ghost'>سحب 100</button></div></section><section class='panel'><h3>تحويل ZC</h3><input id='transferName' placeholder='اسم المستخدم'><input id='transferAmount' type='number' value='100'><button id='transferBtn' class='btn'>تأكيد التحويل</button></section><section class='panel'><h3>سجل التحويلات</h3><ul id='txList'></ul></section><section class='panel'><h3>Top 100</h3><ul id='topList'></ul></section><section class='panel'><h3>الإنجازات</h3><ul id='achList'></ul></section></div><script src='dashboard.js'></script></body></html>
