<!DOCTYPE html><html lang='ar' dir='rtl'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>ZENTRO | لوحة العضو</title><link rel='stylesheet' href='dashboard.css'></head><body><div class='container'><nav><div class='logo'>ZENTRO</div><div><img id='userAvatar' width='32' height='32' style='border-radius:50%'><span id='userName'>زائر</span> <a href='/auth/login'>دخول</a></div></nav><div class='stats'><div>المحفظة<b id='wallet'>0 ZC</b></div><div>البنك<b id='bank'>0 ZC</b></div><div>الإجمالي<b id='total'>0 ZC</b></div></div><button id='depositBtn'>إيداع 100</button><button id='withdrawBtn'>سحب 100</button><div class='card'><h3>المكافأة اليومية</h3><button id='dailyBtn'>استلم 250 ZC</button><p>Daily Streak: <span id='streakDays'>0</span> يوم</p></div><div class='card'><h3>تحويل ZC</h3><input id='transferName' placeholder='اسم المستخدم'><input id='transferAmount' type='number' value='100'><button id='transferBtn'>تأكيد التحويل</button></div><div class='card'><h3>سجل التحويلات</h3><ul id='txList'></ul></div><div class='card'><h3>Top 100</h3><ul id='topList'></ul></div></div><script src='dashboard.js'></script></body></html>
