<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZENTRO | Top 100</title><link rel="stylesheet" href="dashboard.css"></head><body data-page="top"><aside class="sidebar"><div class="logo">ZENTRO<span> COIN</span></div><nav><a href="profile.html">🏠 الملف الشخصي</a><a href="wallet.html">💰 المحفظة والبنك</a><a href="transfer.html">💸 التحويلات</a><a href="top.html" class="active">🏆 Top 100</a></nav><div class="user"><img id="userAvatar" width="34" height="34" alt=""><span id="userName">زائر</span><a class="btn small" href="/auth/login">دخول</a></div></aside><main class="main"><div class="page-head"><p class="eyebrow">الترتيب</p><h1>Top 100</h1><p class="muted">أفضل 100 عضو حسب إجمالي الرصيد.</p></div><section class="card"><div id="list" class="top-list"><p class="muted">جارٍ تحميل الترتيب...</p></div></section></main><script src="dashboard.js"></script><script>
fetch('/api/top').then(r=>r.json()).then(rows=>{const list=document.getElementById('list');if(!Array.isArray(rows)||!rows.length){list.innerHTML='<p class="muted">لا يوجد أعضاء بعد.</p>';return}list.innerHTML=rows.map((u,i)=>'<div class="top-row"><span class="rank">#'+(i+1)+'</span><span class="name">'+(u.username||'عضو')+'</span><span class="amount">'+(u.total||0).toLocaleString()+' ZC</span></div>').join('')}).catch(()=>{document.getElementById('list').innerHTML='<p class="muted">تعذر تحميل الترتيب.</p>'});
</script><style>.top-list{display:grid;gap:10px}.top-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #1c1c1f;border-radius:12px;background:#0b0b0e}.rank{color:#d4af37;font-weight:900;min-width:44px}.name{flex:1}.amount{color:#14b8a6;font-weight:900}</style></body></html>
