<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZENTRO STORE — المتجر</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2308080b'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='34' fill='%23fff'%3EZ%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080b;--w:#fff;--g:#a0a0ab;--g2:#63636d;--ln:rgba(255,255,255,.09);--purple:#a855f7;--purple2:#c084fc}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Tajawal,sans-serif;background:var(--bg);color:var(--w);min-height:100vh}
.nav{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:20px;padding:10px 12px 10px 22px;border-radius:999px;background:rgba(8,8,11,.75);border:1px solid var(--ln);backdrop-filter:blur(14px)}
.nav .brand{font-weight:700;font-size:16px;letter-spacing:2px}
.nav a{color:var(--g);font-size:14px;text-decoration:none;transition:.25s}
.nav a:hover{color:var(--w)}
.hero{padding:140px 5vw 60px;text-align:center}
.hero .kick{color:var(--purple2);font-size:12px;letter-spacing:5px;font-weight:700}
.hero h1{font-size:clamp(38px,7vw,80px);font-weight:900;margin:18px 0 14px;background:linear-gradient(90deg,#fff,var(--purple2),#fff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
@keyframes sh{100%{background-position:-200% 0}}
.hero p{color:var(--g);max-width:520px;margin:0 auto;font-size:16px;line-height:2}
.wrap{max-width:1100px;margin:0 auto;padding:20px 5vw 100px}
.state{text-align:center;color:var(--g);padding:60px 0;font-size:15px}
.state.error{color:#f3b3b3}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{position:relative;padding:28px 24px;border-radius:24px;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--ln);transition:.35s;overflow:hidden}
.card:hover{border-color:rgba(168,85,247,.5);transform:translateY(-3px)}
.card .badge{position:absolute;top:18px;left:18px;font-size:11px;padding:5px 12px;border-radius:999px;border:1px solid rgba(168,85,247,.4);color:var(--purple2);background:rgba(168,85,247,.08)}
.card h3{font-size:19px;font-weight:800;margin-bottom:10px;padding-left:70px}
.card p{color:var(--g);font-size:14px;line-height:1.9}
.empty{ text-align:center;padding:80px 20px;color:var(--g)}
.empty .big{font-size:44px;margin-bottom:14px}
.note{ text-align:center;color:var(--g2);font-size:13px;padding:30px 0;border-top:1px solid var(--ln);margin-top:60px}
@media(max-width:640px){.hero{padding-top:110px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="nav"><div class="brand"><b>ZENTRO</b></div><a href="/">الرئيسية</a><a href="/dashboard">حسابك</a></nav>
<header class="hero">
<div class="kick">ZENTRO STORE</div>
<h1>متجر السيرفر</h1>
<p>تصفح المنتجات المتاحة في سيرفرك — الشراء والمراجعة يتمان يدويًا عبر Discord.</p>
</header>
<main class="wrap">
<div class="state" id="status">جارٍ تحميل المنتجات…</div>
<section class="grid" id="grid" hidden></section>
<div class="empty" id="empty" hidden><div class="big">🛒</div><p id="emptyText">لا توجد منتجات متاحة حاليًا.</p></div>
</main>
<footer class="note">ZENTRO STORE — العرض فقط. الشراء والمراجعة يدويان عبر Discord.</footer>
<script>
(function(){
'use strict';
var params=new URLSearchParams(location.search);
var guild=params.get('guild');
var status=document.getElementById('status');
var grid=document.getElementById('grid');
var empty=document.getElementById('empty');
var emptyText=document.getElementById('emptyText');
function showState(text,isError){status.hidden=!text;status.textContent=text;status.className='state'+(isError?' error':'');}
function render(products){
grid.replaceChildren();
products.forEach(function(p){
var card=document.createElement('article');card.className='card';
var badge=document.createElement('span');badge.className='badge';badge.textContent='قريبًا';
var h=document.createElement('h3');h.textContent=p.name||'منتج';
var d=document.createElement('p');d.textContent=p.description||'';
card.append(badge,h,d);grid.append(card);
});
grid.hidden=false;
}
function load(){
if(!guild||!/^[0-9]{17,20}$/.test(guild)){
showState('');empty.hidden=false;emptyText.textContent='أضف بوت ZENTRO إلى سيرفرك واستخدم رابط المتجر الخاص به، أو افتح المتجر من داخل Discord عبر /store.';
return;
}
showState('جارٍ تحميل المنتجات…');
fetch('/api/store/products?guild='+encodeURIComponent(guild),{credentials:'same-origin',cache:'no-store'})
.then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json()})
.then(function(data){
var products=(data&&data.products)||[];
showState('');
if(!products.length){empty.hidden=false;emptyText.textContent='لا توجد منتجات متاحة لهذا السيرفر بعد.';return;}
render(products);
})
.catch(function(){showState('تعذر تحميل المنتجات حاليًا. حاول لاحقًا.',true)});
}
load();
})();
</script>
</body>
</html>
