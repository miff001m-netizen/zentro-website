<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZENTRO | التحويلات</title><link rel="stylesheet" href="dashboard.css"></head><body data-page="transfer"><aside class="sidebar"><div class="logo">ZENTRO<span> COIN</span></div><nav><a href="profile.html">🏠 الملف الشخصي</a><a href="wallet.html">💰 المحفظة والبنك</a><a href="transfer.html" class="active">💸 التحويلات</a><a href="top.html">🏆 Top 100</a></nav><div class="user"><img id="userAvatar" width="34" height="34" alt=""><span id="userName">زائر</span><a class="btn small" href="/auth/login">دخول</a></div></aside><main class="main"><div class="page-head"><p class="eyebrow">تحويل العملات</p><h1>التحويلات</h1><p class="muted">حوّل عملاتك لأصدقائك داخل السيرفر.</p></div><section class="card action-card"><div><p class="eyebrow">تحويل جديد</p><h2>أرسل ZC</h2><p class="muted">أدخل اسم المستخدم والمبلغ.</p></div><form id="transferForm" class="row action-row"><input id="username" placeholder="اسم المستخدم" required style="flex:1;min-width:180px;padding:12px;border-radius:12px;border:1px solid #1c1c1f;background:#131317;color:#f5f5f7"><input id="amount" type="number" min="1" placeholder="المبلغ" required style="flex:1;min-width:140px;padding:12px;border-radius:12px;border:1px solid #1c1c1f;background:#131317;color:#f5f5f7"><button class="btn" type="submit">تحويل</button></form><div id="notice" class="notice"></div></section><section class="tips"><div class="tip"><span>⚡</span><p>تأكد من وجود رصيد كافٍ في المحفظة قبل التحويل.</p></div><div class="tip"><span>🎯</span><p>اكتب اسم المستخدم بشكل صحيح حتى يصل التحويل.</p></div></section></main><script src="dashboard.js"></script><script>
const form=document.getElementById('transferForm');const notice=document.getElementById('notice');
form.addEventListener('submit',async e=>{e.preventDefault();const username=document.getElementById('username').value.trim();const amount=parseInt(document.getElementById('amount').value);notice.className='notice';notice.textContent='جارٍ التحويل...';try{const r=await fetch('/api/transfer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,amount})});const d=await r.json().catch(()=>({}));if(!r.ok){const map={insufficient:'الرصيد غير كافٍ.',user:'المستخدم غير موجود.',self:'لا يمكنك التحويل لنفسك.',bad:'بيانات غير صالحة.',unauthorized:'سجّل الدخول أولًا.'};throw new Error(map[d.error]||'فشل التحويل.')}notice.className='notice ok';notice.textContent='تم تحويل '+amount+' ZC إلى '+username+' بنجاح.';form.reset()}catch(err){notice.className='notice err';notice.textContent=err.message||'فشل التحويل.'}});
</script></body></html>
