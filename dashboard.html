<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZENTRO — حسابك</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#08080b;--w:#fff;--g:#a0a0ab;--g2:#63636d;--ln:rgba(255,255,255,.09);--glass:rgba(255,255,255,.05)}body{font-family:Tajawal,sans-serif;background:var(--bg);color:var(--w);line-height:1.8;overflow-x:hidden}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}.aurora,.stars{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}.aurora span{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;animation:float 22s ease-in-out infinite alternate;background:radial-gradient(circle,rgba(128,128,128,.14),transparent 65%)}.a1{width:640px;height:640px;top:-240px;left:calc(50% - 320px)}.a2{width:460px;height:460px;bottom:-200px;right:-100px}.a3{width:380px;height:380px;top:40%;left:-140px}.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 5s ease infinite}@keyframes float{to{transform:translate(36px,-26px) scale(1.12)}}@keyframes tw{0%,100%{opacity:.12}50%{opacity:.7}}.menu-btn{position:fixed;top:18px;right:18px;z-index:100;width:42px;height:42px;border-radius:12px;border:1px solid var(--ln);background:var(--glass);color:var(--w);font-size:20px;display:none}.sidebar{position:fixed;top:0;right:0;bottom:0;width:210px;padding:24px 16px;background:rgba(255,255,255,.04);border-left:1px solid var(--ln);backdrop-filter:blur(6px);z-index:90;display:flex;flex-direction:column;gap:6px;transition:transform .3s ease}.sidebar .brand{font-family:'Space Grotesk';font-weight:700;letter-spacing:2px;font-size:16px;margin-bottom:18px}.sidebar a{padding:10px 14px;border-radius:12px;color:var(--g);font-size:14px;transition:.2s}.sidebar a:hover{background:var(--glass);color:var(--w)}.sidebar a.active{background:var(--glass);color:var(--w)}.sidebar a.danger{color:#f87171;margin-top:auto}.main{margin-right:210px;padding:40px 5vw;max-width:1100px}.head{text-align:center;margin-bottom:26px}.kick{font-size:11px;letter-spacing:4px;color:var(--g2)}h1{font-size:clamp(26px,5vw,44px);font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{padding:20px;border-radius:20px;border:1px solid var(--ln);background:var(--glass);backdrop-filter:blur(8px);animation:up .4s ease both}.card h3{font-family:'Space Grotesk';font-size:15px;margin-bottom:12px}.profile{display:flex;align-items:center;gap:14px}.profile img,.profile .av{width:56px;height:56px;border-radius:18px;object-fit:cover}.profile .av{display:grid;place-items:center;background:var(--w);color:var(--bg);font-weight:900;font-family:'Space Grotesk'}.profile b{font-family:'Space Grotesk';font-size:16px}.profile small{display:block;color:var(--g);font-size:11px;direction:ltr}.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ln)}.stat:last-child{border:none}.stat span{color:var(--g);font-size:13px}.stat b{font-family:'Space Grotesk';font-size:14px}.btn{display:inline-block;padding:10px 16px;border-radius:12px;border:1px solid var(--ln);background:var(--glass);color:var(--w);font-size:13px;transition:.2s}.btn:hover{border-color:var(--g2);transform:translateY(-2px)}.btn:active{transform:scale(.97)}.btn.primary{background:var(--w);color:var(--bg);font-weight:700}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tx{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln);font-size:13px}.tx:last-child{border:none}.tx .in{color:#34d399}.tx .out{color:#f87171}.notice{color:var(--g);text-align:center;padding:30px}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@media(max-width:900px){.menu-btn{display:block}.sidebar{transform:translateX(100%)}.sidebar.open{transform:none}.main{margin-right:0;padding:70px 5vw}.grid{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><div class="aurora"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div><div class="stars" id="stars"></div><button class="menu-btn" id="menuBtn">☰</button><aside class="sidebar" id="sidebar"><div class="brand">ZENTRO</div><a class="active" href="/dashboard">حسابك</a><a href="/transfers">التحويلات</a><a href="/top100">Top 100</a><a class="danger" href="/auth/logout">تسجيل الخروج</a></aside><main class="main"><div class="head"><span class="kick">— لوحة التحكم</span><h1>حسابك</h1></div><div class="grid" id="grid"><p class="notice">جارٍ تحميل بياناتك…</p></div></main><script>const el=id=>document.getElementById(id);const fmt=v=>Number(v||0).toLocaleString('ar-EG');async function load(){try{const r=await fetch('/api/me',{credentials:'same-origin'});if(r.status===401){location.replace('/auth/login');return}if(!r.ok)throw 0;const d=await r.json();if(d.guest){location.replace('/auth/login');return}const u=d.user;const av=u.avatar?`<img src="${u.avatar}" alt="">`:`<div class="av">${(u.username||'?').charAt(0).toUpperCase()}</div>`;el('grid').innerHTML=`<div class="card"><h3>الملف الشخصي</h3><div class="profile">${av}<div><b>${u.username}</b><small>${u.discord_id}</small></div></div><div class="row"><span class="btn">المستوى: ${u.level}</span><span class="btn">XP: ${fmt(u.xp)}</span></div></div><div class="card"><h3>الأرصدة</h3><div class="stat"><span>المحفظة</span><b>${fmt(u.wallet)} ZC</b></div><div class="stat"><span>البنك</span><b>${fmt(u.bank)} ZC</b></div><div class="stat"><span>الإجمالي</span><b>${fmt(d.total)} ZC</b></div><div class="row"><button class="btn primary" id="dailyBtn">المكافأة اليومية</button><button class="btn" id="transferBtn">تحويل</button></div></div><div class="card"><h3>آخر العمليات</h3><div id="txs">لا توجد عمليات بعد.</div></div><div class="card"><h3>إيداع / سحب</h3><div class="row"><button class="btn" id="depBtn">إيداع للبنك</button><button class="btn" id="withBtn">سحب من البنك</button></div><p class="notice" id="msg"></p></div>`;const msg=t=>{el('msg').textContent=t};el('dailyBtn').onclick=async()=>{const r=await fetch('/api/daily',{method:'POST',credentials:'same-origin'});const j=await r.json().catch(()=>({}));msg(j.error==='write_disabled'?'الكتابة معطّلة حاليًا من السيرفر.':(j.amount?`تمت إضافة ${fmt(j.amount)} ZC`:'تعذّر تنفيذ الطلب'))};el('transferBtn').onclick=async()=>{const to=prompt('معرّف المستلم (Discord ID):');const amt=prompt('المبلغ:');if(!to||!amt)return;const r=await fetch('/api/transfer',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({to,amount:Number(amt)})});const j=await r.json().catch(()=>({}));msg(j.error==='write_disabled'?'الكتابة معطّلة حاليًا من السيرفر.':(j.ok?'تم التحويل':'تعذّر التحويل'))};el('depBtn').onclick=async()=>{const amt=prompt('مبلغ الإيداع:');if(!amt)return;const r=await fetch('/api/bank',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({action:'deposit',amount:Number(amt)})});const j=await r.json().catch(()=>({}));msg(j.error==='write_disabled'?'الكتابة معطّلة حاليًا من السيرفر.':(j.ok?'تم الإيداع':'تعذّر الإيداع'))};el('withBtn').onclick=async()=>{const amt=prompt('مبلغ السحب:');if(!amt)return;const r=await fetch('/api/bank',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({action:'withdraw',amount:Number(amt)})});const j=await r.json().catch(()=>({}));msg(j.error==='write_disabled'?'الكتابة معطّلة حاليًا من السيرفر.':(j.ok?'تم السحب':'تعذّر السحب'))};const tr=await fetch('/api/transactions',{credentials:'same-origin'});if(tr.ok){const arr=await tr.json();const list=Array.isArray(arr)?arr:[];const box=el('txs');if(!list.length){box.textContent='لا توجد عمليات بعد.'}else{box.innerHTML=list.slice(0,10).map(t=>{const incoming=t.recipient_user_id===u.discord_id;return `<div class="tx"><span>${incoming?'استلام':'إرسال'}</span><b class="${incoming?'in':'out'}">${incoming?'+':'-'}${fmt(t.amount)} ZC</b></div>`}).join('')}}}}catch(e){el('grid').innerHTML='<p class="notice">تعذّر تحميل بياناتك.</p>'}}el('menuBtn').onclick=e=>{e.stopPropagation();el('sidebar').classList.toggle('open')};document.addEventListener('click',e=>{const sb=el('sidebar');if(!sb.contains(e.target)&&e.target!==el('menuBtn'))sb.classList.remove('open')});document.querySelectorAll('.sidebar a').forEach(a=>a.onclick=()=>el('sidebar').classList.remove('open'));for(let i=0;i<50;i++){const s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*5+'s';el('stars').appendChild(s)}load();</script></body></html>
