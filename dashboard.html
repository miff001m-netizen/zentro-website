<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة العضو — ZENTRO COIN</title>
<style>
:root{--bg:#0b0b0f;--card:#15151d;--gold:#f1c40f;--text:#f5f5f5;--muted:#a0a0b0;--border:#2a2a36}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;line-height:1.6}
.container{max-width:1100px;margin:auto;padding:24px 20px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.logo{font-weight:800;font-size:22px}.logo span{color:var(--gold)}
.user{display:flex;align-items:center;gap:12px}
.user img{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold)}
.btn{padding:10px 18px;border-radius:12px;background:var(--gold);color:#111;font-weight:700;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:28px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px}
.card h3{color:var(--muted);font-size:14px;margin-bottom:8px}
.card .value{font-size:28px;font-weight:900;color:var(--gold)}
.section-title{margin:24px 0 14px;font-size:20px;font-weight:800}
.table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.table th,.table td{padding:12px;border-bottom:1px solid var(--border);text-align:right;font-size:14px}
.table th{background:#1c1c26;color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">ZENTRO <span>COIN</span></div>
    <div class="user" id="userBox"></div>
    <a class="btn" href="/auth/logout">خروج</a>
  </header>
  <div class="grid">
    <div class="card"><h3>المحفظة</h3><div class="value" id="wallet">—</div></div>
    <div class="card"><h3>البنك</h3><div class="value" id="bank">—</div></div>
    <div class="card"><h3>XP</h3><div class="value" id="xp">—</div></div>
    <div class="card"><h3>المستوى</h3><div class="value" id="level">—</div></div>
    <div class="card"><h3>الترتيب</h3><div class="value" id="rank">—</div></div>
  </div>
  <div class="section-title">أحدث التحويلات</div>
  <table class="table">
    <thead><tr><th>النوع</th><th>الطرف الآخر</th><th>المبلغ</th><th>التاريخ</th></tr></thead>
    <tbody id="txBody"></tbody>
  </table>
  <div class="empty" id="empty" hidden>لا توجد تحويلات بعد.</div>
</div>
<script>
(async()=>{
  const r=await fetch('/api/me');const d=await r.json();
  if(d.guest){location.href='/';return}
  const u=d.user;
  document.getElementById('userBox').innerHTML=`<img src="${u.avatar||''}" alt=""><div><div>${u.username||'عضو'}</div><div style="color:var(--muted);font-size:13px">ID: ${u.discord_id}</div></div>`;
  wallet.textContent=u.wallet.toLocaleString('ar-EG');
  bank.textContent=u.bank.toLocaleString('ar-EG');
  xp.textContent=u.xp.toLocaleString('ar-EG');
  level.textContent=u.level;
  rank.textContent=d.rank?`#${d.rank}`:'—';
  const body=document.getElementById('txBody');
  if(!d.transactions.length){document.getElementById('empty').hidden=false;return}
  body.innerHTML=d.transactions.map(t=>{
    const outgoing=t.sender===u.discord_id;
    const other=outgoing?(t.receiver||t.receiver_id||'—'):(t.sender||t.sender_id||'—');
    return `<tr><td style="color:${outgoing?'#ff6b6b':'#4ade80'}">${outgoing?'صادر':'وارد'}</td><td>${other}</td><td>${t.amount.toLocaleString('ar-EG')} ZC</td><td>${new Date(t.created_at).toLocaleString('ar-EG')}</td></tr>`
  }).join('');
})();
</script>
</body>
</html>
