<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07060b"><title>ZENTRO COIN | لوحة العضو</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet"><style>:root{--bg:#07060b;--panel:rgba(255,255,255,.045);--panel-solid:#12111a;--line:rgba(255,255,255,.09);--gold:#f3c614;--gold2:#ffdf63;--text:#f5f3ef;--muted:#a8a5b4;--green:#4ade80;--red:#fb7185;--violet:#7c3aed}*{box-sizing:border-box}body{margin:0;background:radial-gradient(700px 420px at 82% 8%,rgba(124,58,237,.16),transparent 65%),radial-gradient(620px 420px at 12% 25%,rgba(243,198,20,.09),transparent 62%),radial-gradient(900px 600px at 50% 110%,rgba(124,58,237,.10),transparent 70%),var(--bg);color:var(--text);font:16px/1.65 Cairo,system-ui,Tahoma,sans-serif}a{color:inherit;text-decoration:none}.shell{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.side{background:rgba(13,12,19,.86);border-left:1px solid var(--line);padding:24px 14px;position:sticky;top:0;height:100vh;backdrop-filter:blur(16px)}.brand{font-size:21px;font-weight:900;margin:0 10px 25px}.gold{color:var(--gold)}.nav{display:grid;gap:6px}.nav a{padding:12px 14px;border-radius:13px;color:var(--muted);display:flex;gap:10px;align-items:center;border:1px solid transparent;transition:.2s}.nav a.active,.nav a:hover{background:linear-gradient(120deg,rgba(243,198,20,.13),rgba(124,58,237,.10));color:var(--gold2);border-color:rgba(243,198,20,.22)}.main{min-width:0;padding:25px max(20px,4vw) 90px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:28px}.top h1{margin:0;font-size:clamp(23px,4vw,34px);letter-spacing:-.6px}.logout{border:1px solid var(--line);border-radius:11px;padding:9px 14px;color:var(--muted);transition:.2s}.logout:hover{color:var(--gold2);border-color:rgba(243,198,20,.3)}.profile{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,rgba(243,198,20,.10),rgba(124,58,237,.10) 60%,rgba(255,255,255,.03));border:1px solid rgba(243,198,20,.22);padding:22px;border-radius:20px;margin-bottom:24px;backdrop-filter:blur(14px)}.avatar{width:68px;height:68px;border-radius:50%;border:2px solid var(--gold);object-fit:cover}.profile strong{font-size:20px}.muted{color:var(--muted)}.small{font-size:13px;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0;backdrop-filter:blur(14px);transition:.2s}.card:hover{border-color:rgba(243,198,20,.28);transform:translateY(-2px)}.value{font-size:27px;font-weight:900;color:var(--gold);overflow-wrap:anywhere}.section{margin:26px 0 14px;font-size:21px;letter-spacing:-.4px}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:12px 0}.row:last-child{border:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{flex:1 1 180px;background:rgba(255,255,255,.04);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px}.filter{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);border-radius:10px;padding:9px 12px;cursor:pointer;transition:.2s}.filter.active{color:#111;background:var(--gold);border-color:var(--gold)}.positive{color:var(--green)}.negative{color:var(--red)}.bottom{display:none}.member{display:flex;align-items:center;gap:12px;min-width:0}.member img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1px solid var(--line);flex:0 0 auto}.member .fallback{width:40px;height:40px;border-radius:50%;background:linear-gradient(145deg,rgba(243,198,20,.22),rgba(124,58,237,.18));color:var(--gold2);display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 auto}.member div{min-width:0}.member strong{display:block;overflow-wrap:anywhere}.member .muted{font-size:13px}.top-row{border-radius:14px;padding:11px 12px;margin-bottom:8px;background:rgba(255,255,255,.035);border:1px solid var(--line)}.top-row.first{border-color:var(--gold);background:linear-gradient(120deg,rgba(243,198,20,.16),rgba(255,255,255,.03))}.top-row.second{border-color:#c0c0c0}.top-row.third{border-color:#cd7f32}.rank-badge{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;background:rgba(255,255,255,.05);border:1px solid var(--line);flex:0 0 auto}.top-row.first .rank-badge{background:var(--gold);color:#111;border-color:var(--gold)}.top-row.second .rank-badge{background:#c0c0c0;color:#111;border-color:#c0c0c0}.top-row.third .rank-badge{background:#cd7f32;color:#111;border-color:#cd7f32}@media(max-width:760px){.shell{display:block}.side{display:none}.main{padding:18px 16px 85px}.profile{padding:16px}.avatar{width:55px;height:55px}.bottom{display:flex;position:fixed;bottom:0;right:0;left:0;z-index:5;background:rgba(13,12,19,.95);border-top:1px solid var(--line);padding:7px 5px max(8px,env(safe-area-inset-bottom));gap:6px;backdrop-filter:blur(14px)}.bottom a{flex:1;text-align:center;font-size:12px;color:var(--muted);padding:6px;border-radius:10px}.bottom a span{display:block;font-size:20px}.bottom a.active{background:linear-gradient(120deg,rgba(243,198,20,.15),rgba(124,58,237,.10));color:var(--gold2)}}@media(max-width:390px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.value{font-size:23px}}</style></head><body><div class="shell"><aside class="side"><div class="brand">ZENTRO <span class="gold">COIN</span></div><nav class="nav" id="sideNav"></nav></aside><main class="main"><header class="top"><h1 id="title">الرئيسية</h1><a class="logout" href="/auth/logout">خروج</a></header><div class="profile"><img class="avatar" id="avatar" alt="صورة العضو" hidden><div><strong id="username">جاري التحميل...</strong><div class="muted small" id="discordId"></div><div class="small"><span id="profileLevel"></span> <span class="gold" id="profileXp"></span></div></div></div><div id="content" aria-live="polite"></div></main></div><nav class="bottom" id="bottomNav" aria-label="التنقل"></nav><script>const pages=[['dashboard','⌂','الرئيسية'],['transfers','⇄','التحويلات'],['leaderboard','★','المتصدرون']];const route=location.pathname.split('/').filter(Boolean)[0]||'dashboard';const active=pages.some(x=>x[0]===route)?route:'dashboard';const $=id=>document.getElementById(id);const fmt=n=>Number(n||0).toLocaleString('ar-EG');const node=(tag,text,cls)=>{const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x};function nav(){pages.forEach(([slug,icon,label])=>[$('sideNav'),$('bottomNav')].forEach(el=>{const a=document.createElement('a');a.href='/'+slug;if(slug===active)a.className='active';a.append(node('span',icon),document.createTextNode(label));el.append(a)}));$('title').textContent=pages.find(x=>x[0]===active)[2]}nav();function card(label,value){const c=node('div','','card');c.append(node('div',label,'muted'),node('div',value,'value'));return c}function grid(items){const g=node('div','','grid');items.forEach(x=>g.append(card(x[0],x[1])));return g}function heading(t){return node('h2',t,'section')}async function request(url){const r=await fetch(url,{credentials:'same-origin'});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'تعذّر تحميل البيانات');return d}function txName(t,u){return t.sender===u.discord_id?(t.receiver_name||t.receiver||'عضو'):(t.sender_name||t.sender||'عضو')}function transactions(data,u){const list=node('div','','list');if(!data.length){list.append(node('p','لا توجد تحويلات مطابقة.','muted'));return list}data.forEach(t=>{const out=t.sender===u.discord_id,row=node('div','','row'),left=node('div');left.append(node('div',(out?'صادر إلى ':'وارد من ')+txName(t,u)),node('div',new Date(t.created_at).toLocaleString('ar-EG'),'small muted'));row.append(left,node('span',(out?'−':'＋')+fmt(t.amount)+' ZC',out?'negative':'positive'));list.append(row)});return list}async function communityActivity(){const wrap=node('div','','card');wrap.append(node('p','جارٍ تحميل نشاط المجتمع...','muted'));try{const data=await request('/api/activity');wrap.innerHTML='';if(!data.length){wrap.append(node('p','لا يوجد نشاط بعد.','muted'));return wrap}const list=node('div','','list');data.forEach(x=>{const row=node('div','','row');row.append(node('div',x.sender+' ← '+x.receiver),node('span','+'+fmt(x.amount)+' ZC','positive'));list.append(row)});wrap.append(list)}catch(e){wrap.innerHTML='';wrap.append(node('p','تعذّر تحميل نشاط المجتمع.','negative'))}return wrap}async function transferHistory(u){const wrap=node('div'),tools=node('div','','toolbar'),search=document.createElement('input'),host=node('div');search.placeholder='ابحث باسم المستخدم';let type='all',timer;[['all','الكل'],['sent','الصادر'],['received','الوارد']].forEach(([key,label])=>{const b=node('button',label,'filter'+(key==='all'?' active':''));b.type='button';b.onclick=()=>{type=key;tools.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');load()};tools.append(b)});tools.append(search);async function load(){host.innerHTML='';host.append(node('p','جارٍ تحميل السجل...','muted'));try{const p=new URLSearchParams({type,search:search.value.trim(),limit:'100'});const data=await request('/api/transactions?'+p);host.innerHTML='';host.append(transactions(data,u))}catch(e){host.innerHTML='';host.append(node('p',e.message,'negative'))}}search.oninput=()=>{clearTimeout(timer);timer=setTimeout(load,250)};wrap.append(tools,host);await load();return wrap}function memberRow(p,index,metric){const row=node('div','','top-row'+(index===0?' first':index===1?' second':index===2?' third':''));row.append(node('div',String(index+1),'rank-badge'));const member=node('div','','member');if(p.avatar){const img=document.createElement('img');img.src=p.avatar;img.alt='صورة '+(p.username||'العضو');img.loading='lazy';member.append(img)}else{member.append(node('div',(p.username||'عضو').slice(0,1).toUpperCase(),'fallback'))}const info=node('div');info.append(node('strong',p.username||'عضو'));if(metric==='xp')info.append(node('div',fmt(p.xp)+' XP • المستوى '+fmt(p.level),'muted'));else info.append(node('div',fmt(p.total)+' ZC','muted'));member.append(info);row.append(member,node('span',metric==='xp'?fmt(p.xp)+' XP':fmt(p.total)+' ZC','gold'));return row}async function leaderboard(){const wrap=node('div'),tabs=node('div','','toolbar'),host=node('div');let tab='wealth';async function load(){host.innerHTML='';host.append(node('p','جارٍ تحميل المتصدرين...','muted'));try{const data=await request(tab==='wealth'?'/api/top':'/api/topxp');host.innerHTML='';if(!data.length){host.append(node('p','لا توجد بيانات بعد.','muted'));return}const box=node('div','','card');data.forEach((p,i)=>box.append(memberRow(p,i,tab==='wealth'?'wealth':'xp')));host.append(box)}catch(e){host.innerHTML='';host.append(node('p',e.message||'تعذّر تحميل المتصدرين','negative'))}}[['wealth','أغنى الأعضاء'],['xp','أعلى XP']].forEach(([key,label])=>{const b=node('button',label,'filter'+(key===tab?' active':''));b.type='button';b.onclick=()=>{tab=key;tabs.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');load()};tabs.append(b)});wrap.append(tabs,host);await load();return wrap}async function load(){try{const d=await request('/api/me');if(d.guest){location.replace('/auth/login');return}const u=d.user,av=$('avatar');if(u.avatar){av.src=u.avatar;av.hidden=false}$('username').textContent=u.username||'عضو ZENTRO';$('discordId').textContent='ID: '+u.discord_id;$('profileLevel').textContent='المستوى '+fmt(u.level);$('profileXp').textContent='• '+fmt(u.xp)+' XP';const root=$('content'),stats=[['الرصيد',fmt(u.wallet)+' ZC'],['XP',fmt(u.xp)],['المستوى',fmt(u.level)],['الترتيب',d.rank?'#'+fmt(d.rank):'—']];if(active==='dashboard'){root.append(grid(stats),heading('أحدث التحويلات'),transactions(d.transactions,u),heading('نشاط المجتمع'),await communityActivity())}if(active==='transfers'){root.append(heading('سجل التحويلات'));root.append(await transferHistory(u))}if(active==='leaderboard'){root.append(await leaderboard())}}catch(e){$('content').append(node('p',e.message||'تعذّر تحميل الصفحة','negative'))}}load();</script></body></html>
