<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZENTRO COIN | لوحة العضو</title><style>:root{--bg:#0b0b0f;--panel:#15151d;--line:#2a2a36;--gold:#f1c40f;--text:#f5f5f5;--muted:#a0a0b0;--green:#4ade80;--red:#fb7185}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,Tahoma,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.side{background:#111117;border-left:1px solid var(--line);padding:24px 14px;position:sticky;top:0;height:100vh}.brand{font-size:21px;font-weight:900;margin:0 10px 25px}.brand span,.gold{color:var(--gold)}.nav{display:grid;gap:5px}.nav a{padding:12px 14px;border-radius:12px;color:var(--muted);display:flex;gap:10px;align-items:center}.nav a.active,.nav a:hover{background:#282317;color:var(--gold)}.main{min-width:0;padding:25px max(20px,4vw) 90px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:30px}.top h1{margin:0;font-size:clamp(23px,4vw,34px)}.logout{border:1px solid var(--line);border-radius:10px;padding:8px 13px;color:var(--muted)}.profile{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,#221d14,#15151d 75%);border:1px solid #53441c;padding:22px;border-radius:18px;margin-bottom:24px}.avatar{width:68px;height:68px;border-radius:50%;border:2px solid var(--gold);object-fit:cover}.profile strong{font-size:20px}.muted{color:var(--muted)}.small{font-size:13px;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}.value{font-size:27px;font-weight:900;color:var(--gold);overflow-wrap:anywhere}.section{margin:24px 0 14px;font-size:21px}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:11px 0}.row:last-child{border:0}.form{display:grid;gap:10px;max-width:480px}.form input{width:100%;background:#0e0e14;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}.btn{border:0;border-radius:10px;background:var(--gold);color:#111;padding:11px 17px;font-weight:800}.btn[disabled]{background:#37343a;color:#8e8e98;cursor:not-allowed}.btn.alt{background:#24242e;color:var(--text);border:1px solid var(--line)}.notice{min-height:24px;margin-top:10px}.positive{color:var(--green)}.negative{color:var(--red)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{flex:1 1 180px;background:#0e0e14;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}.filter{border:1px solid var(--line);background:#17171f;color:var(--muted);border-radius:9px;padding:8px 11px}.filter.active{color:#111;background:var(--gold);border-color:var(--gold)}.daily{display:flex;align-items:center;justify-content:space-between;gap:16px;background:linear-gradient(110deg,#2a2311,#17151a);border-color:#6d5818}.daily h3{margin:0 0 3px}.daily p{margin:0}.daily .value{font-size:21px}.bottom{display:none}@media(max-width:760px){.shell{display:block}.side{display:none}.main{padding:18px 16px 105px}.profile{padding:16px}.avatar{width:55px;height:55px}.bottom{display:flex;position:fixed;bottom:0;right:0;left:0;z-index:5;overflow-x:auto;background:#111117;border-top:1px solid var(--line);padding:7px 5px max(8px,env(safe-area-inset-bottom));gap:4px}.bottom a{flex:1 0 65px;text-align:center;font-size:11px;color:var(--muted);padding:5px 3px;border-radius:10px;white-space:nowrap}.bottom a span{display:block;font-size:20px}.bottom a.active{background:#282317;color:var(--gold)}.daily{align-items:flex-start;flex-direction:column}.daily .btn{width:100%}}@media(max-width:390px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.value{font-size:23px}}</style></head><body><div class="shell"><aside class="side"><div class="brand">ZENTRO <span>COIN</span></div><nav class="nav" id="sideNav"></nav></aside><main class="main"><header class="top"><h1 id="title">لوحة العضو</h1><a class="logout" href="/auth/logout">خروج</a></header><div class="profile"><img class="avatar" id="avatar" alt="صورة العضو" hidden><div><strong id="username">جاري تحميل البروفايل...</strong><div class="muted small" id="discordId"></div><div class="small"><span id="profileLevel"></span> <span class="gold" id="profileXp"></span></div></div></div><div id="content" aria-live="polite"></div></main></div><nav class="bottom" id="bottomNav" aria-label="التنقل"></nav><script>const pages=[['dashboard','⌂','الرئيسية'],['profile','◉','البروفايل'],['wallet','◈','المحفظة'],['bank','▣','البنك'],['transfers','⇄','التحويلات'],['leaderboard','★','المتصدرون'],['achievements','◆','الإنجازات'],['settings','⚙','الإعدادات']];const active=pages.some(x=>x[0]===(location.pathname.split('/').filter(Boolean)[0]||'dashboard'))?(location.pathname.split('/').filter(Boolean)[0]||'dashboard'):'dashboard';const $=id=>document.getElementById(id);const fmt=n=>Number(n||0).toLocaleString('ar-EG');const node=(tag,text,cls)=>{const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x};function nav(){for(const [slug,icon,label] of pages){for(const el of [$('sideNav'),$('bottomNav')]){const a=document.createElement('a');a.href='/'+slug;if(slug===active)a.className='active';a.append(node('span',icon),document.createTextNode(label));el.append(a)}}$('title').textContent=pages.find(x=>x[0]===active)[2]}nav();function card(label,value){const c=node('div','','card');c.append(node('div',label,'muted'),node('div',value,'value'));return c}function grid(items){const g=node('div','','grid');items.forEach(x=>g.append(card(x[0],x[1])));return g}function heading(t){return node('h2',t,'section')}function block(cls=''){return node('div','','card '+cls)}function status(where,text,error){where.textContent=text;where.className='notice '+(error?'negative':'positive')}async function request(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'تعذّر تنفيذ العملية');return d}function txName(t,u){return t.sender===u.discord_id?(t.receiver_name||t.receiver||'عضو'):(t.sender_name||t.sender||'عضو')}function transactions(data,u){const list=node('div','','list');if(!data.length){list.append(node('p','لا توجد تحويلات مطابقة.','muted'));return list}data.forEach(t=>{const out=t.sender===u.discord_id,row=node('div','','row'),left=node('div');left.append(node('div',(out?'صادر إلى ':'وارد من ')+txName(t,u)),node('div',new Date(t.created_at).toLocaleString('ar-EG'),'small muted'));row.append(left,node('span',(out?'−':'＋')+fmt(t.amount)+' ZC',out?'negative':'positive'));list.append(row)});return list}function dailyCard(d){const c=block('daily'),copy=node('div');copy.append(node('h3','المكافأة اليومية'),node('p',d.canDaily?'استلم 250 ZC و10 XP اليوم.':'استلمت مكافأة اليوم—ارجع غدًا.','muted'),node('p','سلسلتك الحالية: '+fmt(d.user.streak||0)+' يوم','small gold'));const b=node('button',d.canDaily?'استلام المكافأة':'تم الاستلام','btn');b.disabled=!d.canDaily;b.onclick=async()=>{b.disabled=true;b.textContent='جارٍ الاستلام...';try{const x=await request('/api/daily',{method:'POST',body:'{}'});b.textContent='تمت إضافة '+fmt(x.amount)+' ZC';setTimeout(()=>location.reload(),900)}catch(e){b.disabled=false;b.textContent='حاول مرة أخرى';alert(e.message)}};c.append(copy,b);return c}function bankForm(){const c=block(),f=node('form','','form'),amount=document.createElement('input'),actions=node('div','','toolbar'),msg=node('div','','notice');amount.type='number';amount.min='1';amount.step='1';amount.required=true;amount.placeholder='المبلغ ZC';[['deposit','إيداع'],['withdraw','سحب']].forEach(([action,label])=>{const b=node('button',label,'btn');b.type='button';b.onclick=async()=>{if(!amount.reportValidity())return;try{await request('/api/bank',{method:'POST',body:JSON.stringify({action,amount:Number(amount.value)})});status(msg,'تمت العملية بنجاح',false);setTimeout(()=>location.reload(),700)}catch(e){status(msg,e.message,true)}};actions.append(b)});f.append(amount,actions,msg);c.append(f);return c}function transferForm(){const c=block(),f=node('form','','form'),name=document.createElement('input'),amount=document.createElement('input'),msg=node('div','','notice'),btn=node('button','إرسال التحويل','btn');name.placeholder='اسم المستخدم في Discord';name.required=true;amount.type='number';amount.min='1';amount.step='1';amount.required=true;amount.placeholder='المبلغ ZC';f.onsubmit=async e=>{e.preventDefault();btn.disabled=true;try{await request('/api/transfer',{method:'POST',body:JSON.stringify({username:name.value.trim(),amount:Number(amount.value)})});status(msg,'تم إرسال التحويل بنجاح',false);setTimeout(()=>location.reload(),800)}catch(err){status(msg,err.message,true);btn.disabled=false}};f.append(name,amount,btn,msg);c.append(f);return c}async function transferHistory(u){const wrap=node('div'),tools=node('div','','toolbar'),search=document.createElement('input'),host=node('div'),filters=['all','sent','received'];search.placeholder='ابحث باسم المستخدم';let type='all',timer;filters.forEach(k=>{const labels={all:'الكل',sent:'الصادر',received:'الوارد'},b=node('button',labels[k],'filter'+(k==='all'?' active':''));b.type='button';b.onclick=()=>{type=k;tools.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');load()};tools.append(b)});tools.append(search);async function load(){host.innerHTML='';host.append(node('p','جارٍ تحميل السجل...','muted'));try{const q=new URLSearchParams({type,search:search.value.trim(),limit:'100'});const data=await request('/api/transactions?'+q);host.innerHTML='';host.append(transactions(data,u))}catch(e){host.innerHTML='';host.append(node('p',e.message,'negative'))}}search.oninput=()=>{clearTimeout(timer);timer=setTimeout(load,250)};wrap.append(tools,host);await load();return wrap}async function load(){try{const d=await request('/api/me');if(d.guest){location.replace('/auth/login');return}const u=d.user,av=$('avatar');if(u.avatar){av.src=u.avatar;av.hidden=false}$('username').textContent=u.username||'عضو ZENTRO';$('discordId').textContent='ID: '+u.discord_id;$('profileLevel').textContent='المستوى '+fmt(u.level);$('profileXp').textContent='• '+fmt(u.xp)+' XP';const root=$('content'),balance=[['المحفظة',fmt(u.wallet)+' ZC'],['البنك',fmt(u.bank)+' ZC'],['الإجمالي',fmt(d.total)+' ZC']];if(active==='dashboard'){root.append(dailyCard(d),grid([...balance,['XP',fmt(u.xp)],['المستوى',fmt(u.level)],['الترتيب',d.rank?'#'+fmt(d.rank):'—']]));root.append(heading('أحدث التحويلات'),transactions(d.transactions,u))}if(active==='profile')root.append(grid([['اسم Discord',u.username||'—'],['Discord ID',u.discord_id],['المستوى',fmt(u.level)],['الخبرة',fmt(u.xp)+' XP'],['سلسلة المكافآت',fmt(u.streak||0)+' يوم'],['الترتيب',d.rank?'#'+fmt(d.rank):'—']]));if(active==='wallet')root.append(grid([...balance,['تحويلات صادرة',fmt(d.sentCount)],['تحويلات واردة',fmt(d.receivedCount)]]));if(active==='bank')root.append(grid(balance.slice(0,2)),heading('إدارة البنك'),bankForm());if(active==='transfers'){root.append(heading('تحويل عملات'),transferForm(),heading('سجل التحويلات'));root.append(await transferHistory(u))}if(active==='leaderboard'){const data=await request('/api/top'),box=block();if(!data.length)box.append(node('p','لا توجد بيانات بعد.','muted'));data.forEach((p,i)=>{const row=node('div','','row');row.append(node('span','#'+(i+1)+' '+(p.username||'عضو')),node('span',fmt(p.total)+' ZC','gold'));box.append(row)});root.append(box)}if(active==='achievements'){const box=node('div','','grid');(d.achievements||[]).forEach(a=>box.append(card(a.name,a.unlocked?'مكتمل ✓':'لم يكتمل')));root.append(box)}if(active==='settings'){const box=block(),p=await request('/api/privacy'),f=node('form','','form'),fields=[['show_balance','إظهار الرصيد'],['show_id','إظهار Discord ID'],['show_servers','إظهار السيرفرات'],['show_rank','إظهار الترتيب'],['public_profile','بروفايل عام']];box.append(node('p','إعدادات الخصوصية:','muted'));fields.forEach(([key,label])=>{const line=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.name=key;input.checked=!!p[key];input.style.width='auto';line.append(input,' '+label);f.append(line)});const msg=node('div','','notice'),btn=node('button','حفظ الإعدادات','btn');f.onsubmit=async e=>{e.preventDefault();btn.disabled=true;const payload={};fields.forEach(([key])=>payload[key]=f.elements[key].checked);try{await request('/api/privacy',{method:'POST',body:JSON.stringify(payload)});status(msg,'تم الحفظ',false)}catch(err){status(msg,err.message,true)}btn.disabled=false};f.append(btn,msg);box.append(f);root.append(box)}}catch(e){$('content').append(node('p',e.message||'تعذّر تحميل الصفحة','negative'))}}load();</script></body></html>
