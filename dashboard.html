<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZENTRO COIN | لوحة العضو</title><style>:root{--bg:#0b0b0f;--panel:#15151d;--line:#2a2a36;--gold:#f1c40f;--text:#f5f5f5;--muted:#a0a0b0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,Tahoma,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.side{background:#111117;border-left:1px solid var(--line);padding:24px 14px;position:sticky;top:0;height:100vh}.brand{font-size:21px;font-weight:900;margin:0 10px 25px}.brand span,.gold{color:var(--gold)}.nav{display:grid;gap:5px}.nav a{padding:12px 14px;border-radius:12px;color:var(--muted);display:flex;gap:10px;align-items:center}.nav a.active,.nav a:hover{background:#282317;color:var(--gold)}.main{min-width:0;padding:25px max(20px,4vw) 90px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:30px}.top h1{margin:0;font-size:clamp(23px,4vw,34px)}.logout{border:1px solid var(--line);border-radius:10px;padding:8px 13px;color:var(--muted)}.profile{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,#221d14,#15151d 75%);border:1px solid #53441c;padding:22px;border-radius:18px;margin-bottom:24px}.avatar{width:68px;height:68px;border-radius:50%;border:2px solid var(--gold);object-fit:cover}.profile strong{font-size:20px}.muted{color:var(--muted)}.small{font-size:13px;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}.value{font-size:27px;font-weight:900;color:var(--gold);overflow-wrap:anywhere}.section{margin:24px 0 14px;font-size:21px}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:10px 0}.row:last-child{border:0}.form{display:grid;gap:10px;max-width:440px}.form input{width:100%;background:#0e0e14;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}.btn{border:0;border-radius:10px;background:var(--gold);color:#111;padding:11px 17px;font-weight:800}.notice{min-height:24px;margin-top:10px}.positive{color:#4ade80}.negative{color:#fb7185}.bottom{display:none}@media(max-width:760px){.shell{display:block}.side{display:none}.main{padding:18px 16px 105px}.profile{padding:16px}.avatar{width:55px;height:55px}.bottom{display:flex;position:fixed;bottom:0;right:0;left:0;z-index:5;overflow-x:auto;background:#111117;border-top:1px solid var(--line);padding:7px 5px max(8px,env(safe-area-inset-bottom));gap:4px}.bottom a{flex:1 0 65px;text-align:center;font-size:11px;color:var(--muted);padding:5px 3px;border-radius:10px;white-space:nowrap}.bottom a span{display:block;font-size:20px}.bottom a.active{background:#282317;color:var(--gold)}}@media(max-width:390px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.value{font-size:23px}}</style></head><body><div class="shell"><aside class="side"><div class="brand">ZENTRO <span>COIN</span></div><nav class="nav" id="sideNav"></nav></aside><main class="main"><header class="top"><h1 id="title">لوحة العضو</h1><a class="logout" href="/auth/logout">خروج</a></header><div class="profile"><img class="avatar" id="avatar" alt="صورة العضو" hidden><div><strong id="username">جاري تحميل البروفايل...</strong><div class="muted small" id="discordId"></div><div class="small"><span id="profileLevel"></span> <span class="gold" id="profileXp"></span></div></div></div><div id="content" aria-live="polite"></div></main></div><nav class="bottom" id="bottomNav" aria-label="التنقل"></nav><script>const pages=[['dashboard','⌂','الرئيسية'],['profile','◉','البروفايل'],['wallet','◈','المحفظة'],['bank','▣','البنك'],['transfers','⇄','التحويلات'],['leaderboard','★','المتصدرون'],['achievements','◆','الإنجازات'],['settings','⚙','الإعدادات']];const page=location.pathname.split('/').filter(Boolean)[0]||'dashboard';const active=pages.some(x=>x[0]===page)?page:'dashboard';const $=id=>document.getElementById(id);const fmt=n=>Number(n||0).toLocaleString('ar-EG');const node=(tag,text,cls)=>{const x=document.createElement(tag);x.textContent=text;if(cls)x.className=cls;return x};function nav(){for(const [slug,icon,label] of pages){for(const [el,mobile] of [[$('sideNav'),false],[$('bottomNav'),true]]){const a=document.createElement('a');a.href='/'+slug;if(slug===active)a.className='active';a.append(node('span',icon));a.append(label);el.append(a)}}$('title').textContent=pages.find(x=>x[0]===active)[2]}nav();function card(label,value){const c=node('div','','card');c.append(node('div',label,'muted'),node('div',value,'value'));return c}function grid(items){const g=node('div','','grid');for(const [a,b] of items)g.append(card(a,b));return g}function heading(text){return node('h2',text,'section')}function block(){return node('div','','card')}function transactions(data,me){const list=node('div','','list');if(!data.length){list.append(node('p','لا توجد تحويلات بعد.','muted'));return list}for(const t of data){const row=node('div','','row');const outgoing=t.sender===me.discord_id;row.append(node('span',(outgoing?'صادر إلى ':'وارد من ')+(outgoing?t.receiver:t.sender)),node('span',fmt(t.amount)+' ZC',outgoing?'negative':'positive'));list.append(row)}return list}function status(where,text,error){where.textContent=text;where.className='notice '+(error?'negative':'positive')}async function post(url,payload,where){try{const r=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذّر تنفيذ العملية');status(where,'تمت العملية بنجاح',false);setTimeout(()=>location.reload(),700)}catch(e){status(where,e.message,true)}}function bankForm(){const c=block(),form=node('form','','form'),amount=document.createElement('input'),buttons=node('div','','row'),msg=node('div','','notice');amount.type='number';amount.min='1';amount.step='1';amount.required=true;amount.placeholder='المبلغ ZC';for(const [action,label] of [['deposit','إيداع'],['withdraw','سحب']]){const b=node('button',label,'btn');b.type='button';b.onclick=()=>{if(!amount.reportValidity())return;post('/api/bank',{action,amount:Number(amount.value)},msg)};buttons.append(b)}form.append(amount,buttons,msg);c.append(form);return c}function transferForm(){const c=block(),f=node('form','','form'),name=document.createElement('input'),amount=document.createElement('input'),msg=node('div','','notice'),btn=node('button','إرسال','btn');name.placeholder='اسم المستخدم في Discord';name.required=true;amount.type='number';amount.min='1';amount.step='1';amount.required=true;amount.placeholder='المبلغ ZC';f.onsubmit=e=>{e.preventDefault();post('/api/transfer',{username:name.value.trim(),amount:Number(amount.value)},msg)};f.append(name,amount,btn,msg);c.append(f);return c}async function load(){try{const r=await fetch('/api/me',{credentials:'same-origin',cache:'no-store'});if(!r.ok)throw Error('تعذّر تحميل البيانات');const d=await r.json();if(d.guest){location.replace('/auth/login');return}const u=d.user;const av=$('avatar');if(u.avatar){av.src=u.avatar;av.hidden=false}$('username').textContent=u.username||'عضو ZENTRO';$('discordId').textContent='ID: '+u.discord_id;$('profileLevel').textContent='المستوى '+fmt(u.level);$('profileXp').textContent='• '+fmt(u.xp)+' XP';const root=$('content'),balance=[['المحفظة',fmt(u.wallet)+' ZC'],['البنك',fmt(u.bank)+' ZC'],['الإجمالي',fmt(d.total)+' ZC']];if(active==='dashboard'){root.append(grid([...balance,['XP',fmt(u.xp)],['المستوى',fmt(u.level)],['الترتيب',d.rank?'#'+fmt(d.rank):'—']]));root.append(heading('أحدث التحويلات'),transactions(d.transactions,u))}if(active==='profile'){root.append(grid([['اسم Discord',u.username||'—'],['Discord ID',u.discord_id],['المستوى',fmt(u.level)],['الخبرة',fmt(u.xp)+' XP'],['سلسلة المكافآت',fmt(u.streak||0)+' يوم'],['الترتيب',d.rank?'#'+fmt(d.rank):'—']]))}if(active==='wallet')root.append(grid([...balance,['تحويلات صادرة',fmt(d.sentCount)],['تحويلات واردة',fmt(d.receivedCount)]]));if(active==='bank'){root.append(grid(balance.slice(0,2)),heading('إدارة البنك'),bankForm())}if(active==='transfers'){root.append(heading('تحويل عملات'),transferForm(),heading('أحدث التحويلات'),transactions(d.transactions,u))}if(active==='leaderboard'){const rr=await fetch('/api/top',{credentials:'same-origin'});if(!rr.ok)throw Error('تعذّر تحميل الترتيب');const data=await rr.json(),box=block();if(!data.length)box.append(node('p','لا توجد بيانات بعد.','muted'));data.forEach((p,i)=>{const row=node('div','','row');row.append(node('span','#'+(i+1)+' '+(p.username||'عضو')),node('span',fmt(p.total)+' ZC','gold'));box.append(row)});root.append(box)}if(active==='achievements'){const box=node('div','','grid');for(const a of d.achievements||[])box.append(card(a.name,a.unlocked?'مكتمل ✓':'لم يكتمل'));root.append(box)}if(active==='settings'){const box=block();box.append(node('p','إعدادات الخصوصية:','muted'));const rr=await fetch('/api/privacy',{credentials:'same-origin'});if(!rr.ok)throw Error('تعذّر تحميل الخصوصية');const p=await rr.json();const f=node('form','','form');const fields=[['show_balance','إظهار الرصيد'],['show_id','إظهار Discord ID'],['show_servers','إظهار السيرفرات'],['show_rank','إظهار الترتيب'],['public_profile','بروفايل عام']];for(const [key,label] of fields){const line=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.name=key;input.checked=!!p[key];input.style.width='auto';line.append(input,' '+label);f.append(line)}const msg=node('div','','notice'),btn=node('button','حفظ الإعدادات','btn');f.onsubmit=e=>{e.preventDefault();const payload={};for(const [key] of fields)payload[key]=f.elements[key].checked;post('/api/privacy',payload,msg)};f.append(btn,msg);box.append(f);root.append(box)}}catch(e){$('content').append(node('p',e.message||'تعذّر تحميل الصفحة','negative'))}}load();</script></body></html>
