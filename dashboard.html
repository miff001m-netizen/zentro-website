<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZENTRO — حسابك</title><style>
*{box-sizing:border-box}body{margin:0;background:#08080b;color:#fff;font-family:Tahoma,Arial,sans-serif;line-height:1.8}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}.aurora{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 20% 10%,#31314455,transparent 55%),radial-gradient(ellipse at 90% 80%,#34453e33,transparent 50%);z-index:-1}.sidebar{position:fixed;inset:0 0 0 auto;width:210px;padding:24px 16px;background:#ffffff09;border-left:1px solid #ffffff17;backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:8px}.brand{letter-spacing:3px;font-weight:bold;margin-bottom:18px}.sidebar a{padding:10px 14px;border-radius:12px;color:#a0a0ab}.sidebar a:hover,.sidebar .active{background:#ffffff0d;color:#fff}.sidebar .danger{margin-top:auto;color:#f87171}.main{margin-right:210px;padding:40px 5vw;max-width:1200px}.head{text-align:center;margin-bottom:26px}.head small{color:#a0a0ab}h1{font-size:36px;margin:8px}h3{margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{padding:20px;border:1px solid #ffffff17;border-radius:20px;background:#ffffff0d;backdrop-filter:blur(8px);min-width:0}.profile{display:flex;align-items:center;gap:14px}.avatar{width:56px;height:56px;border-radius:18px;object-fit:cover;display:grid;place-items:center;background:#fff;color:#08080b;font-size:24px}.muted{color:#a0a0ab;font-size:13px;overflow-wrap:anywhere}.stat,.tx{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #ffffff17}.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.btn{padding:10px 16px;border:1px solid #ffffff17;border-radius:12px;background:#ffffff0d;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.in{color:#34d399}.out{color:#f87171}.notice{text-align:center;padding:20px;color:#a0a0ab}.menu-btn{display:none;position:fixed;top:16px;right:16px;z-index:10}.wide{grid-column:1/-1}#msg{overflow-wrap:anywhere}@media(max-width:900px){.menu-btn{display:block}.sidebar{transform:translateX(100%);z-index:9;transition:transform .2s;background:#15151a}.sidebar.open{transform:none}.main{margin-right:0;padding-top:75px}.grid{grid-template-columns:1fr}}
</style></head><body><div class="aurora"></div><button class="btn menu-btn" id="menuBtn" aria-label="فتح القائمة">☰</button><aside class="sidebar" id="sidebar"><div class="brand">ZENTRO</div><a class="active" href="/dashboard">حسابك</a><a href="/transfers">التحويلات</a><a href="/top100">Top 100</a><a class="danger" href="/auth/logout">تسجيل الخروج</a></aside><main class="main"><header class="head"><small>لوحة التحكم</small><h1>حسابك</h1></header><p id="status" class="notice" role="status">جارٍ تحميل بياناتك…</p><button id="retry" class="btn" hidden>إعادة المحاولة</button><section id="cards" class="grid" hidden><article class="card"><h3>الملف الشخصي</h3><div class="profile"><div id="avatarBox"></div><div><b id="username"></b><div id="discordId" class="muted" dir="ltr"></div></div></div><p id="progress" class="muted"></p></article><article class="card"><h3>الأرصدة</h3><div class="stat"><span>المحفظة</span><b id="wallet"></b></div><div class="stat"><span>البنك</span><b id="bank"></b></div><div class="stat"><span>الإجمالي</span><b id="total"></b></div><div class="row"><button class="btn write" id="dailyBtn">المكافأة اليومية</button><button class="btn write" id="transferBtn">تحويل</button></div></article><article class="card"><h3>آخر العمليات</h3><div id="txs">جارٍ تحميل العمليات…</div></article><article class="card"><h3>إيداع / سحب</h3><div class="row"><button class="btn write" id="depBtn">إيداع للبنك</button><button class="btn write" id="withBtn">سحب من البنك</button></div><p class="muted" id="writeNotice"></p><p id="msg" role="status"></p></article></section></main><script>
'use strict';
const el=id=>document.getElementById(id);
const fmt=value=>Number(value||0).toLocaleString('ar-EG');
async function request(url,options={}){
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),15000);
 try{
  const response=await fetch(url,{...options,credentials:'same-origin',cache:'no-store',signal:controller.signal});
  const text=await response.text();
  let data;
  try{data=JSON.parse(text)}catch(e){throw new Error('الخادم لم يُرجع بيانات JSON. رمز الاستجابة: '+response.status)}
  if(response.status===401){location.replace('/auth/login');throw new Error('يلزم تسجيل الدخول')}
  if(!response.ok)throw new Error(data.error==='write_disabled'?'العمليات المالية معطّلة حاليًا من الخادم.':'تعذّر الطلب. رمز الاستجابة: '+response.status);
  return data;
 }catch(error){if(error.name==='AbortError')throw new Error('انتهت مهلة الاتصال بالخادم. حاول مرة أخرى.');throw error}
 finally{clearTimeout(timer)}
}
async function loadTransactions(user){
 try{
  const data=await request('/api/transactions');
  if(!Array.isArray(data))throw new Error('صيغة العمليات غير متوقعة');
  const box=el('txs');box.replaceChildren();
  if(!data.length){box.textContent='لا توجد عمليات بعد.';return}
  data.slice(0,10).forEach(transaction=>{
   const incoming=String(transaction.recipient_user_id)===String(user.discord_id);
   const row=document.createElement('div');row.className='tx';
   const label=document.createElement('span');label.textContent=incoming?'استلام':'إرسال';
   const amount=document.createElement('b');amount.className=incoming?'in':'out';amount.textContent=(incoming?'+':'-')+fmt(transaction.amount)+' ZC';
   row.append(label,amount);box.append(row);
  });
 }catch(error){el('txs').textContent=error.message}
}
async function load(){
 el('status').hidden=false;el('status').textContent='جارٍ تحميل بياناتك…';el('retry').hidden=true;el('cards').hidden=true;
 try{
  const data=await request('/api/me');
  if(data.guest){location.replace('/auth/login');return}
  const user=data.user;if(!user)throw new Error('بيانات الحساب غير مكتملة.');
  el('username').textContent=user.username||'عضو ZENTRO';el('discordId').textContent=user.discord_id||'';
  el('progress').textContent='المستوى: '+(user.level||1)+' — XP: '+fmt(user.xp);
  ['wallet','bank'].forEach(key=>el(key).textContent=fmt(user[key])+' ZC');
  el('total').textContent=fmt(data.total)+' ZC';
  const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=Array.from(user.username||'?')[0];el('avatarBox').replaceChildren(avatar);
  if(user.avatar){try{const url=new URL(user.avatar);if(url.protocol==='https:'&&url.hostname==='cdn.discordapp.com'){const img=document.createElement('img');img.className='avatar';img.alt='صورة الحساب';img.src=url.href;img.onerror=()=>img.replaceWith(avatar);el('avatarBox').replaceChildren(img)}}catch(e){}}
  const disabled=data.writeDisabled===true;document.querySelectorAll('.write').forEach(button=>button.disabled=disabled);
  el('writeNotice').textContent=disabled?'عرض الأرصدة متاح؛ التحويل والإيداع والسحب والمكافأة اليومية معطّلة حاليًا من الخادم.':'';
  el('status').hidden=true;el('cards').hidden=false;await loadTransactions(user);
 }catch(error){el('status').textContent=error.message;el('retry').hidden=false}
}
async function write(url,body){
 try{el('msg').textContent='جارٍ تنفيذ الطلب…';await request(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});el('msg').textContent='تم تنفيذ الطلب.';await load()}
 catch(error){el('msg').textContent=error.message}
}
function bank(action){const input=prompt(action==='deposit'?'مبلغ الإيداع:':'مبلغ السحب:');if(input===null)return;const amount=Number(input);if(!Number.isFinite(amount)||amount<=0){el('msg').textContent='أدخل مبلغًا موجبًا.';return}write('/api/bank',{action,amount})}
el('dailyBtn').onclick=()=>write('/api/daily');
el('transferBtn').onclick=()=>{const to=prompt('معرّف المستلم (Discord ID):');if(!to)return;const input=prompt('المبلغ:');if(input===null)return;const amount=Number(input);if(!/^\d{17,20}$/.test(to.trim())||!Number.isFinite(amount)||amount<=0){el('msg').textContent='أدخل معرّفًا صحيحًا ومبلغًا موجبًا.';return}if(confirm('تأكيد تحويل '+fmt(amount)+' ZC إلى '+to.trim()+'؟'))write('/api/transfer',{to:to.trim(),amount})};
el('depBtn').onclick=()=>bank('deposit');el('withBtn').onclick=()=>bank('withdraw');
el('retry').onclick=load;
el('menuBtn').onclick=event=>{event.stopPropagation();el('sidebar').classList.toggle('open')};
document.addEventListener('click',event=>{if(!el('sidebar').contains(event.target)&&!el('menuBtn').contains(event.target))el('sidebar').classList.remove('open')});
load();
</script></body></html>
