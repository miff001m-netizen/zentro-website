<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZENTRO — Top 100</title><style>*{box-sizing:border-box}body{margin:0;background:#08080b;color:#fff;font:15px/1.8 Tahoma,Arial,sans-serif}a{color:inherit;text-decoration:none}.sidebar{position:fixed;inset:0 0 0 auto;width:210px;padding:24px 16px;background:#ffffff09;border-left:1px solid #ffffff17;display:flex;flex-direction:column;gap:10px}.sidebar a{padding:10px;border-radius:12px}.active,.card{background:#ffffff0d}.main{margin-right:210px;padding:40px 5vw;max-width:1200px}.card{border:1px solid #ffffff17;border-radius:20px;padding:20px;min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}h1{text-align:center}.muted{color:#a0a0ab;overflow-wrap:anywhere}button,input{font:inherit;border:1px solid #ffffff22;border-radius:12px;padding:10px;background:#ffffff0d;color:#fff}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}input{width:100%;margin:8px 0 16px}label{display:block}.tx{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #ffffff17;padding:12px 0}.tx span{overflow-wrap:anywhere}.in{color:#34d399}.out{color:#f87171}.avatar{width:48px;height:48px;border-radius:14px;object-fit:cover;display:grid;place-items:center;background:#fff;color:#08080b}.member{display:flex;align-items:center;gap:12px}.info{flex:1;min-width:0;overflow-wrap:anywhere}.info small{display:block;color:#a0a0ab}.gold{border-color:#d4af37}.silver{border-color:#aaa}.bronze{border-color:#cd7f32}.menu{display:none}#top3{grid-template-columns:repeat(3,1fr);margin-bottom:16px}[hidden]{display:none!important}@media(max-width:900px){.main{margin:0;padding-top:75px}.sidebar{display:none;background:#15151a;z-index:2}.sidebar.open{display:flex}.menu{display:block;position:fixed;top:16px;right:16px;z-index:3}.grid,#top3{grid-template-columns:1fr}}</style></head><body><button id="menu" class="menu" aria-label="فتح القائمة">☰</button><aside id="sidebar" class="sidebar"><b>ZENTRO</b><a href="/dashboard">حسابك</a><a href="/transfers">التحويلات</a><a class="active" href="/top100">Top 100</a><a href="/auth/logout">تسجيل الخروج</a></aside><main class="main"><h1>Top 100</h1><p id="status" class="muted" role="status">جارٍ تحميل الترتيب…</p><button id="retry">إعادة التحميل</button><section id="top3" class="grid"></section><section id="grid" class="grid"></section></main><script>
const el=id=>document.getElementById(id);const fmt=value=>Number(value||0).toLocaleString('ar-EG');
async function request(url,options={}){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);try{const response=await fetch(url,{...options,credentials:'same-origin',cache:'no-store',signal:controller.signal});if(response.status===401){location.replace('/auth/login');throw new Error('يلزم تسجيل الدخول')}let data;try{data=await response.json()}catch(error){throw new Error('استجابة غير متوقعة من الخادم: '+response.status)}if(!response.ok)throw new Error(data.error==='write_disabled'?'التحويلات معطّلة من الخادم.':data.error==='configuration_missing'?'إعدادات الخادم غير مكتملة.':'فشل الطلب: '+response.status);return data}catch(error){if(error.name==='AbortError')throw new Error('انتهت مهلة الاتصال. أعد المحاولة.');throw error}finally{clearTimeout(timer)}}
el('menu').onclick=()=>el('sidebar').classList.toggle('open');document.addEventListener('click',event=>{if(!el('sidebar').contains(event.target)&&!el('menu').contains(event.target))el('sidebar').classList.remove('open')});
function member(person,index){const card=document.createElement('article');card.className='card member '+(['gold','silver','bronze'][index]||'');const rank=document.createElement('b');rank.textContent='#'+(index+1);const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=Array.from(person.username||'?')[0];card.append(rank,avatar);if(person.avatar){try{const url=new URL(person.avatar);if(url.protocol==='https:'&&url.hostname==='cdn.discordapp.com'){const image=document.createElement('img');image.className='avatar';image.alt='صورة العضو';image.src=url.href;image.loading='lazy';image.onerror=()=>image.replaceWith(avatar);avatar.replaceWith(image)}}catch(error){}}const info=document.createElement('div');info.className='info';const name=document.createElement('b');name.textContent=person.username||person.discord_id||'عضو';const id=document.createElement('small');id.dir='ltr';id.textContent=person.discord_id||'';info.append(name,id);const amount=document.createElement('b');amount.textContent=fmt(person.total)+' ZC';card.append(info,amount);return card}
async function load(){el('status').textContent='جارٍ تحميل الترتيب…';el('top3').replaceChildren();el('grid').replaceChildren();try{const data=await request('/api/top');if(!Array.isArray(data))throw new Error('صيغة الترتيب غير متوقعة');data.slice(0,100).forEach((person,index)=>el(index<3?'top3':'grid').append(member(person,index)));el('status').textContent=data.length?'الترتيب حسب مجموع المحفظة والبنك.':'لا يوجد أعضاء في الترتيب بعد.'}catch(error){el('status').textContent=error.message}}
el('retry').onclick=load;load();
</script></body></html>
