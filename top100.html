<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZENTRO — Top 100</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#08080b;--w:#fff;--g:#a0a0ab;--g2:#63636d;--ln:rgba(255,255,255,.09);--glass:rgba(255,255,255,.05)}body{font-family:Tajawal,sans-serif;background:var(--bg);color:var(--w);line-height:1.8;min-height:100vh}a{color:inherit;text-decoration:none}.nav{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;background:rgba(255,255,255,.03);backdrop-filter:blur(6px);border-bottom:1px solid var(--ln)}.brand{font-family:'Space Grotesk';font-weight:700;letter-spacing:2px}.nav a{color:var(--g);font-size:14px}.nav a:hover{color:var(--w)}.wrap{max-width:1100px;margin:auto;padding:40px 5vw}.head{text-align:center;margin-bottom:30px}.kick{font-size:11px;letter-spacing:4px;color:var(--g2)}h1{font-size:clamp(28px,5vw,52px);font-weight:900}.top3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}.podium{padding:22px 16px;border-radius:20px;border:1px solid var(--ln);background:linear-gradient(160deg,rgba(255,215,0,.07),var(--glass));backdrop-filter:blur(8px);text-align:center;animation:up .5s ease both}.podium.silver{border-color:rgba(192,192,192,.35)}.podium.bronze{border-color:rgba(205,127,50,.35)}.podium .medal{font-size:26px}.podium b{display:block;font-family:'Space Grotesk';font-size:18px;margin:6px 0}.podium .amt{color:var(--g);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.glass{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:1px solid var(--ln);background:var(--glass);backdrop-filter:blur(8px);cursor:pointer;transition:.2s;animation:up .4s ease both}.glass:hover{transform:translateY(-3px);border-color:var(--g2)}.glass:active{transform:scale(.97)}.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--w);color:var(--bg);font-weight:900;font-family:'Space Grotesk'}.glass .info{flex:1}.glass .info small{display:block;color:var(--g);font-size:11px}.glass b{font-family:'Space Grotesk';font-size:15px}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.notice{color:var(--g);text-align:center;padding:30px}@media(max-width:700px){.top3,.grid{grid-template-columns:1fr 1fr}}@media(max-width:450px){.top3,.grid{grid-template-columns:1fr}}</style></head><body><nav class="nav"><a class="brand" href="/dashboard">ZENTRO</a><a href="/dashboard">رجوع للوحة</a></nav><div class="wrap"><div class="head"><span class="kick">— الترتيب</span><h1>Top 100</h1></div><div class="top3" id="top3"></div><div class="grid" id="grid"></div><p class="notice" id="status">جارٍ تحميل الترتيب…</p></div><script>const el=id=>document.getElementById(id);const fmt=v=>Number(v||0).toLocaleString('ar-EG');async function load(){try{const r=await fetch('/api/top',{credentials:'same-origin'});if(r.status===401){location.replace('/auth/login');return}if(!r.ok)throw 0;const list=await r.json();const arr=Array.isArray(list)?list:[];el('status').hidden=true;const medals=['🥇','🥈','🥉'];const cls=['','silver','bronze'];const c3=el('top3');c3.innerHTML='';arr.slice(0,3).forEach((p,i)=>{const d=document.createElement('div');d.className='podium '+cls[i];d.innerHTML=`<div class="medal">${medals[i]}</div><b>${p.username}</b><div class="amt">${fmt(p.total)} ZC</div>`;c3.appendChild(d)});const g=el('grid');g.innerHTML='';arr.slice(3,100).forEach((p,i)=>{const d=document.createElement('div');d.className='glass';const initial=(p.username||'?').charAt(0).toUpperCase();d.innerHTML=`<div class="av">${initial}</div><div class="info"><b>#${i+4} · ${p.username}</b><small>إجمالي العملات</small></div><b>${fmt(p.total)} ZC</b>`;g.appendChild(d)})}catch(e){el('status').textContent='تعذّر تحميل الترتيب.'}}load();</script></body></html>
