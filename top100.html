<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZENTRO — Top 100</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#08080b;--w:#fff;--g:#a0a0ab;--g2:#63636d;--ln:rgba(255,255,255,.09);--glass:rgba(255,255,255,.05)}body{font-family:Tajawal,sans-serif;background:var(--bg);color:var(--w);line-height:1.8;overflow-x:hidden}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}.aurora,.stars{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}.aurora span{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;animation:float 22s ease-in-out infinite alternate;background:radial-gradient(circle,rgba(128,128,128,.14),transparent 65%)}.a1{width:640px;height:640px;top:-240px;left:calc(50% - 320px)}.a2{width:460px;height:460px;bottom:-200px;right:-100px}.a3{width:380px;height:380px;top:40%;left:-140px}.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 5s ease infinite}@keyframes float{to{transform:translate(36px,-26px) scale(1.12)}}@keyframes tw{0%,100%{opacity:.12}50%{opacity:.7}}.menu-btn{position:fixed;top:18px;right:18px;z-index:100;width:42px;height:42px;border-radius:12px;border:1px solid var(--ln);background:var(--glass);color:var(--w);font-size:20px;display:none}.sidebar{position:fixed;top:0;right:0;bottom:0;width:210px;padding:24px 16px;background:rgba(255,255,255,.04);border-left:1px solid var(--ln);backdrop-filter:blur(6px);z-index:90;display:flex;flex-direction:column;gap:6px;transition:transform .3s ease}.sidebar .brand{font-family:'Space Grotesk';font-weight:700;letter-spacing:2px;font-size:16px;margin-bottom:18px}.sidebar a{padding:10px 14px;border-radius:12px;color:var(--g);font-size:14px;transition:.2s}.sidebar a:hover{background:var(--glass);color:var(--w)}.sidebar a.active{background:var(--glass);color:var(--w)}.sidebar a.danger{color:#f87171;margin-top:auto}.main{margin-right:210px;padding:40px 5vw;max-width:1200px}.head{text-align:center;margin-bottom:28px}.kick{font-size:11px;letter-spacing:4px;color:var(--g2)}h1{font-size:clamp(26px,5vw,48px);font-weight:900}.top3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}.podium{padding:20px 14px;border-radius:20px;border:1px solid var(--ln);background:linear-gradient(160deg,rgba(255,215,0,.07),var(--glass));backdrop-filter:blur(8px);text-align:center;animation:up .5s ease both}.podium.silver{border-color:rgba(192,192,192,.35)}.podium.bronze{border-color:rgba(205,127,50,.35)}.podium img,.podium .av{width:52px;height:52px;border-radius:16px;object-fit:cover}.podium .av{display:grid;place-items:center;background:var(--w);color:var(--bg);font-weight:900;font-family:'Space Grotesk';margin:0 auto 8px}.podium b{display:block;font-family:'Space Grotesk';font-size:16px}.podium small{display:block;color:var(--g);font-size:11px;direction:ltr}.podium .amt{color:var(--w);font-size:14px;font-family:'Space Grotesk'}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.glass{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1px solid var(--ln);background:var(--glass);backdrop-filter:blur(8px);cursor:pointer;transition:.2s;animation:up .4s ease both}.glass:hover{transform:translateY(-3px);border-color:var(--g2)}.glass:active{transform:scale(.97)}.glass img,.glass .av{width:44px;height:44px;border-radius:12px;object-fit:cover}.glass .av{display:grid;place-items:center;background:var(--w);color:var(--bg);font-weight:900;font-family:'Space Grotesk'}.glass .info{flex:1}.glass .info b{font-family:'Space Grotesk';font-size:14px}.glass .info small{display:block;color:var(--g);font-size:10px;direction:ltr}.glass .rank{font-family:'Space Grotesk';color:var(--g);font-size:13px}.glass .amt{font-family:'Space Grotesk';font-size:14px}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.notice{color:var(--g);text-align:center;padding:30px}@media(max-width:900px){.menu-btn{display:block}.sidebar{transform:translateX(100%)}.sidebar.open{transform:none}.main{margin-right:0;padding:70px 5vw}.top3,.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.top3,.grid{grid-template-columns:1fr}}</style></head><body><div class="aurora"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div><div class="stars" id="stars"></div><button class="menu-btn" id="menuBtn">☰</button><aside class="sidebar" id="sidebar"><div class="brand">ZENTRO</div><a href="/dashboard">حسابك</a><a href="/transfers">التحويلات</a><a class="active" href="/top100">Top 100</a><a class="danger" href="/auth/logout">تسجيل الخروج</a></aside><main class="main"><div class="head"><span class="kick">— الترتيب</span><h1>Top 100</h1></div><div class="top3" id="top3"></div><div class="grid" id="grid"></div><p class="notice" id="status">جارٍ تحميل الترتيب…</p></main><script>const el=id=>document.getElementById(id);const fmt=v=>Number(v||0).toLocaleString('ar-EG');async function load(){try{const r=await fetch('/api/top',{credentials:'same-origin'});if(r.status===401){location.replace('/auth/login');return}if(!r.ok)throw 0;const arr=await r.json();const list=Array.isArray(arr)?arr:[];el('status').hidden=true;const medals=['🥇','🥈','🥉'];const cls=['','silver','bronze'];const c3=el('top3');c3.innerHTML='';list.slice(0,3).forEach((p,i)=>{const av=p.avatar?`<img src="${p.avatar}" alt="">`:`<div class="av">${(p.username||'?').charAt(0).toUpperCase()}</div>`;const d=document.createElement('div');d.className='podium '+cls[i];d.innerHTML=`<div class="medal">${medals[i]}</div>${av}<b>${p.username}</b><small>${p.username}</small><div class="amt">${fmt(p.total)} ZC</div>`;c3.appendChild(d)});const g=el('grid');g.innerHTML='';list.slice(3,100).forEach((p,i)=>{const av=p.avatar?`<img src="${p.avatar}" alt="">`:`<div class="av">${(p.username||'?').charAt(0).toUpperCase()}</div>`;const d=document.createElement('div');d.className='glass';d.innerHTML=`${av}<div class="info"><b>${p.username}</b><small>${p.username}</small></div><span class="rank">#${i+4}</span><b class="amt">${fmt(p.total)} ZC</b>`;g.appendChild(d)})}catch(e){el('status').textContent='تعذّر تحميل الترتيب.'}}el('menuBtn').onclick=e=>{e.stopPropagation();el('sidebar').classList.toggle('open')};document.addEventListener('click',e=>{const sb=el('sidebar');if(!sb.contains(e.target)&&e.target!==el('menuBtn'))sb.classList.remove('open')});document.querySelectorAll('.sidebar a').forEach(a=>a.onclick=()=>el('sidebar').classList.remove('open'));for(let i=0;i<50;i++){const s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*5+'s';el('stars').appendChild(s)}load();</script></body></html>
