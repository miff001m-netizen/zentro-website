<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZENTRO | التوب 100</title>
<style>
:root{--bg:#050507;--surface:#0b0b0e;--surface-2:#131317;--line:#1c1c1f;--text:#f5f5f7;--muted:#8a8a93;--gold:#d4af37;--teal:#14b8a6;--green:#22c55e;--red:#f43f5e}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}.glow{position:fixed;top:-210px;left:50%;width:760px;height:760px;transform:translateX(-50%);background:radial-gradient(circle,rgba(20,184,166,.15),transparent 62%);filter:blur(54px);pointer-events:none}.glow2{position:fixed;bottom:-250px;right:-160px;width:590px;height:590px;background:radial-gradient(circle,rgba(212,175,55,.10),transparent 62%);filter:blur(62px);pointer-events:none}.login{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;position:relative}.card{background:rgba(11,11,14,.91);border:1px solid var(--line);border-radius:24px;padding:48px 36px;max-width:420px;width:100%;backdrop-filter:blur(10px)}.coin{width:72px;height:72px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:var(--gold);background:radial-gradient(circle at 30% 30%,#1a1a1d,#0b0b0d);border:1px solid rgba(212,175,55,.45);box-shadow:0 0 30px rgba(212,175,55,.15)}.logo,.brand{font-weight:900;letter-spacing:2px}.logo span,.brand span{color:var(--gold)}.logo{margin-bottom:18px}h1{font-size:26px;margin-bottom:10px}p{color:var(--muted);font-size:15px;line-height:1.8;margin-bottom:28px}.btn{display:inline-block;padding:15px 30px;border-radius:14px;background:#5865f2;color:#fff;text-decoration:none;font-weight:900;transition:.2s}.btn:hover{transform:translateY(-2px)}.app{display:none;position:relative}.topbar{display:flex;align-items:center;gap:14px;padding:15px 20px;background:rgba(11,11,14,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.burger{width:42px;height:42px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-size:20px;cursor:pointer}.sidebar{position:fixed;top:0;right:0;bottom:0;width:270px;background:rgba(11,11,14,.97);backdrop-filter:blur(10px);border-left:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:6px;transform:translateX(100%);transition:.3s;z-index:20}.sidebar.open{transform:translateX(0)}.sidebar .brand{margin-bottom:18px;padding:0 8px}.nav{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:700}.nav:hover,.nav.active{background:var(--surface-2);color:var(--text)}.nav.active{color:var(--teal)}.logout{margin-top:auto;color:var(--red);text-decoration:none;font-weight:700;padding:12px 16px;border-radius:12px;border:1px solid var(--line);text-align:center}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:15}.overlay.show{display:block}.main{padding:24px 20px 140px;max-width:1100px;margin:0 auto}.title{text-align:center;margin-bottom:22px}.title h1{font-size:24px}.title p{margin:0}.top3{display:flex;justify-content:center;gap:30px;flex-wrap:wrap;margin-bottom:26px}.t3{text-align:center;width:150px}.t3 .medal{font-size:26px}.t3 img,.t3 .avatar-fallback{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid rgba(212,175,55,.55);margin:8px auto}.t3 .avatar-fallback{display:grid;place-items:center;background:var(--surface-2);color:var(--gold);font-weight:900;font-size:24px}.t3 .name{font-weight:800;font-size:14px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.t3 .coins{color:var(--gold);font-weight:900;font-size:13px;direction:ltr}.list{display:flex;flex-direction:column;gap:10px}.row{display:flex;align-items:center;gap:12px;background:rgba(11,11,14,.94);border:1px solid var(--line);border-radius:16px;padding:12px 14px}.row .pos{width:44px;text-align:center;color:var(--muted);font-weight:800}.row img,.row .avatar-fallback{width:42px;height:42px;border-radius:50%;object-fit:cover}.row .avatar-fallback{display:grid;place-items:center;background:var(--surface-2);color:var(--gold);font-weight:900}.row .name{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .coins{color:var(--gold);font-weight:900;direction:ltr}.me{position:fixed;bottom:0;left:0;right:0;background:rgba(11,11,14,.97);border-top:1px solid rgba(212,175,55,.4);backdrop-filter:blur(10px);padding:12px 16px;display:none;z-index:12}.me-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}.me img,.me .avatar-fallback{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid rgba(212,175,55,.5)}.me .avatar-fallback{display:grid;place-items:center;background:var(--surface-2);color:var(--gold);font-weight:900}.me .name{flex:1;font-weight:800}.me .coins{color:var(--gold);font-weight:900;direction:ltr}.me .rank{background:var(--surface-2);border:1px solid rgba(212,175,55,.4);color:var(--gold);border-radius:12px;padding:8px 12px;font-weight:900;white-space:nowrap}@media(max-width:640px){.top3{gap:16px}.row .pos{width:34px;font-size:13px}.row{padding:10px}.row .name{font-size:13px}.row .coins{font-size:12px}}
</style>
</head>
<body>
<div class="glow"></div><div class="glow2"></div>
<div class="login" id="login"><div class="card"><div class="coin">ZC</div><div class="logo">ZENTRO<span> COIN</span></div><h1>التوب 100</h1><p>سجّل الدخول لعرض ترتيبك بين أغنى أعضاء ZENTRO.</p><a class="btn" href="/auth/login">تسجيل الدخول عبر Discord</a></div></div>
<div class="app" id="app">
<div class="topbar"><button class="burger" onclick="toggleSidebar()">☰</button><div class="brand">ZENTRO<span> COIN</span></div></div>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
<aside class="sidebar" id="sidebar"><div class="brand">ZENTRO<span> COIN</span></div><a class="nav" href="profile.html">🏠 الرئيسية</a><a class="nav" href="transfers.html">💸 التحويلات</a><a class="nav active" href="leaderboard.html">🏆 التوب 100</a><a class="logout" href="/auth/logout">تسجيل الخروج</a></aside>
<main class="main">
<div class="title"><h1>🏆 التوب 100</h1><p>ترتيب أغنى 100 عضو في ZENTRO</p></div>
<div class="top3" id="top3"></div>
<div class="list" id="list"></div>
<div class="title" style="margin-top:40px"><h1>📊 Top XP</h1><p>أعلى 100 عضو في نقاط الخبرة</p></div>
<div class="list" id="xplist"></div>
</main>
</div>
<div class="me" id="me"><div class="me-inner"><span id="meAvatar"></span><div class="name" id="meName"></div><div class="coins"><span id="meCoins">0</span> ZC</div><div class="rank">ترتيبك <span id="meRank">—</span></div></div></div>
<script>
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('show')}
function medal(i){return ['🥇','🥈','🥉'][i]}
function av(u){const name=(u&&u.username)||'؟';return u&&u.avatar?'<img src="'+u.avatar+'" alt="">':'<div class="avatar-fallback">'+name[0]+'</div>'}
async function loadAll(){
const me=await fetch('/api/me').then(r=>r.json()).catch(()=>null);
if(!me||me.guest||!me.user){document.getElementById('login').style.display='grid';document.getElementById('app').style.display='none';return}
document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';
const u=me.user;document.getElementById('meAvatar').innerHTML=av(u);document.getElementById('meName').textContent=u.username||'عضو';document.getElementById('meCoins').textContent=(u.wallet+u.bank).toLocaleString();document.getElementById('meRank').textContent='#'+(me.rank||'—');document.getElementById('me').style.display='block';
const rows=await fetch('/api/top').then(r=>r.json()).catch(()=>[]);
const top3=document.getElementById('top3'),list=document.getElementById('list');
const t3=rows.slice(0,3);
let html='';
for(let i=0;i<3;i++){const u2=t3[i];html+='<div class="t3"><div class="medal">'+medal(i)+'</div>'+av(u2)+'<div class="name">'+(u2?u2.username||'عضو':'—')+'</div><div class="coins">'+(u2?(u2.total||0).toLocaleString():'0')+' ZC</div></div>'}
top3.innerHTML=html;
list.innerHTML='';
rows.slice(3).forEach((u2,i)=>{list.insertAdjacentHTML('beforeend','<div class="row"><div class="pos">#'+(i+4)+'</div>'+av(u2)+'<div class="name">'+(u2.username||'عضو')+'</div><div class="coins">'+(u2.total||0).toLocaleString()+' ZC</div></div>')});
const xrows=await fetch('/api/topxp').then(r=>r.json()).catch(()=>[]);
const xpList=document.getElementById('xplist');
xpList.innerHTML='';
xpList.insertAdjacentHTML('beforeend','<div class="row" style="background:rgba(20,184,166,.08);border-color:rgba(20,184,166,.35)"><div class="pos">أنت</div>'+av(u)+'<div class="name">'+(u.username||'عضو')+'</div><div class="coins">'+(u.xp||0).toLocaleString()+' XP • Level '+(u.level||1)+'</div></div>');
xpList.insertAdjacentHTML('beforeend','<div style="height:10px"></div>');
xrows.forEach((u2,i)=>{const pos=i<3?medal(i):'#'+(i+1);xpList.insertAdjacentHTML('beforeend','<div class="row"><div class="pos">'+pos+'</div>'+av(u2)+'<div class="name">'+(u2.username||'عضو')+'</div><div class="coins">'+(u2.xp||0).toLocaleString()+' XP • L'+(u2.level||1)+'</div></div>')});
}
loadAll();
setInterval(loadAll,15000);
</script>
</body>
</html>
