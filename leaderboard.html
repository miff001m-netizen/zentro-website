<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZENTRO | Hall of Fame</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,Tahoma,sans-serif;background:#07070b;color:#f2f2f5;min-height:100vh}.glow{position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:700px;height:700px;background:radial-gradient(circle,rgba(212,175,55,.12),transparent 60%);filter:blur(60px);pointer-events:none}.login{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.card{background:rgba(15,15,22,.9);border:1px solid #23232e;border-radius:22px;padding:44px 32px;max-width:400px;width:100%}.logo{font-weight:900;letter-spacing:2px;margin-bottom:16px}.logo span{color:#d4af37}.btn{display:inline-block;padding:14px 28px;border-radius:12px;background:#5865f2;color:#fff;text-decoration:none;font-weight:800}.app{display:none}.top{display:flex;align-items:center;gap:12px;padding:14px 18px;background:rgba(12,12,18,.9);border-bottom:1px solid #1e1e28;position:sticky;top:0;z-index:5}.brand{font-weight:900;letter-spacing:2px}.brand span{color:#d4af37}.main{max-width:1000px;margin:0 auto;padding:22px 16px 120px}h1{text-align:center;font-size:24px}.season{text-align:center;color:#a855f7;font-size:13px;margin:8px 0 18px}.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}.f{padding:9px 14px;border-radius:11px;background:#15151f;border:1px solid #26263a;color:#8b8b99;cursor:pointer;font-size:12px;font-weight:700}.f.active{background:rgba(212,175,55,.12);border-color:#d4af37;color:#fff}#q{display:block;width:100%;max-width:420px;margin:0 auto 20px;padding:12px 16px;border-radius:12px;background:#12121a;border:1px solid #26263a;color:#fff;outline:none}.podium{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin-bottom:24px}.p{text-align:center;width:150px}.p .medal{font-size:26px}.p img,.p .fb{width:64px;height:64px;border-radius:50%;object-fit:cover;margin:8px auto;border:3px solid}.p .fb{display:grid;place-items:center;background:#15151f;color:#d4af37;font-weight:900;font-size:22px}.p.gold img,.p.gold .fb{border-color:#d4af37;box-shadow:0 0 18px rgba(212,175,55,.35)}.p.silver img,.p.silver .fb{border-color:#c0c0c0}.p.bronze img,.p.bronze .fb{border-color:#cd7f32}.p .name{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.p .pts{color:#d4af37;font-weight:900;font-size:13px;direction:ltr}.p .lvl{color:#8b8b99;font-size:11px}table{width:100%;border-collapse:collapse;font-size:13px;background:rgba(15,15,22,.92);border:1px solid #22222e;border-radius:14px;overflow:hidden}th,td{padding:11px;text-align:right;border-bottom:1px solid #1e1e28}th{color:#8b8b99;font-size:12px}td img,td .fb{width:34px;height:34px;border-radius:50%;object-fit:cover;vertical-align:middle}td .fb{display:inline-grid;place-items:center;background:#15151f;color:#d4af37;font-weight:900}.gold{color:#d4af37}.muted{color:#8b8b99}.me{position:fixed;bottom:0;left:0;right:0;background:rgba(12,12,18,.97);border-top:1px solid rgba(212,175,55,.4);backdrop-filter:blur(10px);padding:12px 16px;display:none;z-index:9;text-align:center;font-size:13px}.me b{color:#d4af37}</style></head><body><div class="glow"></div><div class="login" id="login"><div class="card"><div class="logo">ZENTRO<span> COIN</span></div><h2>Hall of Fame</h2><p class="muted" style="margin:12px 0 22px">سجّل الدخول لعرض ترتيبك بين أفضل 100 عضو.</p><a class="btn" href="/auth/login">تسجيل الدخول</a></div></div><div class="app" id="app"><div class="top"><div class="brand">ZENTRO<span> COIN</span></div><a href="profile.html" style="margin-inline-start:auto;color:#a855f7;text-decoration:none;font-weight:700;font-size:13px">بروفايلي</a></div><main class="main"><h1>🏆 ZENTRO Hall of Fame</h1><div class="season">Season 01 — Neon Rush • قريبًا</div><div class="filters"><div class="f active">كل الأوقات</div><div class="f" onclick="soon()">أسبوعي</div><div class="f" onclick="soon()">شهري</div><div class="f" onclick="soon()">أعلى رصيد</div><div class="f" onclick="soon()">أعلى XP</div></div><input id="q" placeholder="ابحث عن عضو..." oninput="render()"><div class="podium" id="podium"></div><table><thead><tr><th>المركز</th><th>اللاعب</th><th>المستوى</th><th>النقاط</th></tr></thead><tbody id="rows"></tbody></table></main><div class="me" id="me">ترتيبك الحالي: <b id="myrank">—</b> • نقاطك: <b id="mypoints">0</b> • <span id="need" class="muted"></span></div></div><script>function soon(){alert('هذا الفلتر قريبًا')}
let DATA=[],ME=null;
function av(u){const n=(u&&u.username)||'؟';return u&&u.avatar?`<img src="${u.avatar}" alt="">`:`<span class="fb">${n[0]}</span>`}
function fmt(n){return (n||0).toLocaleString()}
function render(){const q=(document.getElementById('q').value||'').trim().toLowerCase();const list=DATA.filter(u=>!q||(u.username||'').toLowerCase().includes(q));const pod=document.getElementById('podium');const top=list.slice(0,3);const cls=['gold','silver','bronze'];const medals=['🥇','🥈','🥉'];pod.innerHTML=top.map((u,i)=>`<div class="p ${cls[i]}"><div class="medal">${medals[i]}</div>${av(u)}<div class="name">${u.username||'عضو'}</div><div class="pts">${fmt(u.xp)} PTS</div><div class="lvl">Level ${u.level||1}</div></div>`).join('');const rows=document.getElementById('rows');rows.innerHTML=list.slice(3,100).map((u,i)=>`<tr><td class="muted">#${i+4}</td><td>${av(u)} ${u.username||'عضو'}</td><td class="muted">L${u.level||1}</td><td class="gold" style="direction:ltr">${fmt(u.xp)}</td></tr>`).join('')}
async function load(){const me=await fetch('/api/me').then(r=>r.json()).catch(()=>null);if(!me||me.guest||!me.user){login.style.display='grid';app.style.display='none';return}login.style.display='none';app.style.display='block';ME=me;let rows=await fetch('/api/topxp').then(r=>r.json()).catch(()=>[]);if(!Array.isArray(rows)||!rows.length){rows=await fetch('/api/top').then(r=>r.json()).catch(()=>[])||[]}DATA=rows;render();const u=me.user;document.getElementById('myrank').textContent='#'+(me.rank||'—');document.getElementById('mypoints').textContent=fmt(u.xp||0);const hundred=DATA[99];const needEl=document.getElementById('need');if(hundred&&(u.xp||0)<hundred.xp){needEl.textContent=`تحتاج ${fmt(hundred.xp-(u.xp||0))} نقطة للوصول إلى Top 100`}else{needEl.textContent='أنت داخل الـ Top 100 🎉'}document.getElementById('me').style.display='block'}
load();setInterval(load,20000);</script></body></html>
