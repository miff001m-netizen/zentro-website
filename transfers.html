<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZENTRO | التحويلات</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#07070b;--surface:#0d0d14;--surface2:#15151f;--line:#22222e;--text:#f2f2f5;--muted:#8b8b99;--gold:#d4af37;--purple:#a855f7;--teal:#2dd4bf;--green:#22c55e;--red:#f43f5e}body{font-family:system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}.glow{position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:700px;height:700px;background:radial-gradient(circle,rgba(168,85,247,.16),transparent 60%);filter:blur(60px);pointer-events:none}.glow2{position:fixed;bottom:-220px;right:-140px;width:560px;height:560px;background:radial-gradient(circle,rgba(212,175,55,.10),transparent 60%);filter:blur(60px);pointer-events:none}.app{position:relative}.top{display:flex;align-items:center;gap:12px;padding:14px 18px;background:rgba(13,13,20,.92);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.brand{font-weight:900;letter-spacing:2px}.brand span{color:var(--gold)}.burger{width:40px;height:40px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);color:var(--text);font-size:18px;cursor:pointer}.sidebar{position:fixed;top:0;right:0;bottom:0;width:220px;background:var(--surface);border-left:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;z-index:30;transform:translateX(100%);transition:.3s}.sidebar.open{transform:none}.slogo{font-weight:900;letter-spacing:2px;margin-bottom:14px;padding:0 8px}.slogo span{color:var(--gold)}.sidebar a{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:700;font-size:14px}.sidebar a:hover,.sidebar a.active{background:var(--surface2);color:var(--text)}.sidebar a.active{color:var(--purple)}.sidebar .out{margin-top:auto;color:var(--red);border:1px solid #3a2030;text-align:center}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:25}.overlay.show{display:block}@media(min-width:900px){.sidebar{transform:none}.main{margin-right:244px}}.main{max-width:760px;margin:0 auto;padding:22px 18px 32px}.page-head h1{font-size:24px;margin:6px 0}.muted{color:var(--muted)}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}.tx-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tx-tools input{background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 12px;font-size:13px;flex:1;min-width:160px}.tx-tools button{background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 12px;font-size:13px;cursor:pointer}.tx-tools button.active{border-color:var(--purple);color:var(--purple)}.tx-list{display:flex;flex-direction:column;gap:10px}.tx{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}.tx .icon{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--surface2)}.tx .info{flex:1;min-width:0}.tx .names{font-weight:800;font-size:14px}.tx .date{font-size:11px;color:var(--muted)}.tx .amount{font-weight:900}.green{color:var(--green)}.red{color:var(--red)}.load-more{width:100%;margin-top:12px;background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;cursor:pointer}.empty{color:var(--muted);text-align:center;padding:18px}</style></head><body><div class="glow"></div><div class="glow2"></div><div class="app"><div class="top"><button class="burger" onclick="toggleSidebar()">☰</button><div class="brand">ZENTRO<span> COIN</span></div></div><div class="overlay" id="overlay" onclick="toggleSidebar()"></div><aside class="sidebar" id="sidebar"><div class="slogo">ZENTRO<span> COIN</span></div><a href="profile.html">🏠 البروفايل</a><a class="active" href="transfers.html">💸 التحويلات</a><a href="leaderboard.html">🏆 Hall of Fame</a><a class="out" href="/auth/logout">تسجيل الخروج</a></aside><main class="main"><section class="page-head"><p class="muted">سجل عملياتك</p><h1>التحويلات</h1><p class="muted">كل التحويلات اللي حوّلتها أو استلمتها.</p></section><section class="card"><div class="tx-tools"><button class="active" data-type="all" onclick="setType('all',this)">الكل</button><button data-type="sent" onclick="setType('sent',this)">حوّلت</button><button data-type="received" onclick="setType('received',this)">استلمت</button><input id="search" placeholder="بحث باسم العضو" oninput="onSearch()"><button onclick="exportCSV()">تصدير CSV</button></div><div id="txlist" class="tx-list"><p class="empty">جارٍ التحميل...</p></div><button class="load-more" id="loadmore" onclick="loadMore()">تحميل المزيد</button></section></main></div><script>function toggleSidebar(){sidebar.classList.toggle('open');overlay.classList.toggle('show')}
let uid=null;let txState={type:'all',search:'',limit:20,offset:0,rows:[]};
function setType(t,btn){txState.type=t;txState.offset=0;txState.rows=[];document.querySelectorAll('.tx-tools button[data-type]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');loadTx()}
function onSearch(){clearTimeout(window._st);window._st=setTimeout(()=>{txState.search=document.getElementById('search').value;txState.offset=0;txState.rows=[];loadTx()},300)}
function loadMore(){txState.offset+=txState.limit;loadTx(true)}
function loadTx(append){const p=new URLSearchParams({type:txState.type,search:txState.search,limit:txState.limit,offset:txState.offset});fetch('/api/transactions?'+p).then(r=>r.json()).then(rows=>{if(!append)txState.rows=rows;else txState.rows=txState.rows.concat(rows);render()})}
function render(){const list=document.getElementById('txlist');if(!txState.rows.length){list.innerHTML='<p class="empty">لا توجد تحويلات.</p>';document.getElementById('loadmore').style.display='none';return}list.innerHTML=txState.rows.map(t=>{const out=t.sender===uid;const name=out?('إلى: '+(t.receiver_name||t.receiver)):('من: '+(t.sender_name||t.sender));const amount=(out?'-':'+')+(t.amount||0).toLocaleString()+' ZC';const d=new Date(t.created_at);const date=d.toLocaleDateString('ar-EG')+' – '+d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});return '<div class="tx"><div class="icon">'+(out?'📤':'📥')+'</div><div class="info"><div class="names">'+name+'</div><div class="date">'+date+'</div></div><div class="amount '+(out?'red':'green')+'">'+amount+'</div></div>'}).join('');document.getElementById('loadmore').style.display=txState.rows.length>=txState.offset+txState.limit?'block':'none'}
function exportCSV(){const rows=txState.rows;if(!rows.length)return;const csv='type,sender,receiver,amount,date\n'+rows.map(t=>{const out=t.sender===uid;return (out?'sent':'received')+','+(t.sender_name||t.sender)+','+(t.receiver_name||t.receiver)+','+t.amount+','+t.created_at}).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='transactions.csv';a.click()}
fetch('/api/me').then(r=>r.json()).then(d=>{if(d.guest||!d.user){document.getElementById('txlist').innerHTML='<p class="empty">سجّل الدخول لعرض التحويلات.</p>';return}uid=d.user.discord_id;loadTx()})
</script></body></html>
