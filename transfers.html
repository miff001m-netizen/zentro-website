<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZENTRO — كل التحويلات</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#08080b;--w:#fff;--g:#a0a0ab;--g2:#63636d;--ln:rgba(255,255,255,.09);--glass:rgba(255,255,255,.05)}body{font-family:Tajawal,sans-serif;background:var(--bg);color:var(--w);line-height:1.8;min-height:100vh}a{color:inherit;text-decoration:none}.nav{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;background:rgba(255,255,255,.03);backdrop-filter:blur(6px);border-bottom:1px solid var(--ln)}.brand{font-family:'Space Grotesk';font-weight:700;letter-spacing:2px}.nav a{color:var(--g);font-size:14px}.nav a:hover{color:var(--w)}.wrap{max-width:900px;margin:auto;padding:40px 5vw}.head{text-align:center;margin-bottom:24px}.kick{font-size:11px;letter-spacing:4px;color:var(--g2)}h1{font-size:clamp(26px,5vw,46px);font-weight:900}.filters{display:flex;justify-content:center;gap:8px;margin-bottom:20px}.filters button{padding:8px 18px;border-radius:999px;border:1px solid var(--ln);background:var(--glass);color:var(--g);font-size:12px}.filters button.on{background:var(--w);color:var(--bg);border-color:var(--w)}.tx{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border:1px solid var(--ln);border-radius:14px;background:var(--glass);backdrop-filter:blur(8px);margin-bottom:8px;animation:up .4s ease both}.tx small{display:block;color:var(--g);font-size:11px}.tx .amount{font-family:'Space Grotesk';font-weight:700}.tx .in{color:#4ade80}.tx .out{color:#f87171}.status{padding:3px 10px;border-radius:999px;border:1px solid var(--ln);font-size:11px;color:var(--g)}.status.completed{color:#4ade80;border-color:rgba(74,222,128,.35)}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.notice{color:var(--g);text-align:center;padding:30px}</style></head><body><nav class="nav"><a class="brand" href="/dashboard">ZENTRO</a><a href="/dashboard">رجوع للوحة</a></nav><div class="wrap"><div class="head"><span class="kick">— السجل الكامل</span><h1>كل التحويلات</h1></div><div class="filters"><button class="on" data-f="all">الكل</button><button data-f="in">وارد</button><button data-f="out">صادر</button></div><div id="list"></div><p class="notice" id="status">جارٍ تحميل التحويلات…</p></div><script>const el=id=>document.getElementById(id);const fmt=v=>Number(v||0).toLocaleString('ar-EG');let allTx=[],me=null;async function load(){try{const meR=await fetch('/api/me',{credentials:'same-origin'});if(meR.status===401){location.replace('/auth/login');return}const meD=await meR.json();if(meD.guest){location.replace('/auth/login');return}me=meD.user;const r=await fetch('/api/transactions?limit=100',{credentials:'same-origin'});const rows=await r.json();allTx=Array.isArray(rows)?rows:[];el('status').hidden=true;draw('all')}catch(e){el('status').textContent='تعذّر تحميل التحويلات.'}}function draw(f){const c=el('list');c.innerHTML='';const list=allTx.filter(t=>f==='all'||(f==='out'?String(t.sender_user_id)===String(me.discord_id):String(t.recipient_user_id)===String(me.discord_id)));if(!list.length){c.innerHTML='<p class="notice">لا توجد تحويلات.</p>';return}list.forEach(t=>{const sent=String(t.sender_user_id)===String(me.discord_id);const d=document.createElement('div');d.className='tx';d.innerHTML=`<div><b>${sent?'صادر إلى ':'وارد من '}${sent?t.recipient_user_id:t.sender_user_id}</b><small>${new Date(t.created_at).toLocaleString('ar-EG')}</small></div><b class="amount ${sent?'out':'in'}">${sent?'−':'+'}${fmt(t.recipient_amount??t.amount)} ZC</b><span class="status ${t.status||'completed'}">${t.status==='failed'?'فشلت':'مكتملة'}</span>`;c.appendChild(d)})}document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on'));b.classList.add('on');draw(b.dataset.f)});load();</script></body></html>
