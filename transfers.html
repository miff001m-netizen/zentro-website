<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZENTRO — التحويلات</title><style>*{box-sizing:border-box}body{margin:0;background:#08080b;color:#fff;font:15px/1.8 Tahoma,Arial,sans-serif}a{color:inherit;text-decoration:none}.sidebar{position:fixed;inset:0 0 0 auto;width:210px;padding:24px 16px;background:#ffffff09;border-left:1px solid #ffffff17;display:flex;flex-direction:column;gap:10px}.sidebar a{padding:10px;border-radius:12px}.active,.card{background:#ffffff0d}.main{margin-right:210px;padding:40px 5vw;max-width:1200px}.card{border:1px solid #ffffff17;border-radius:20px;padding:20px;min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}h1{text-align:center}.muted{color:#a0a0ab;overflow-wrap:anywhere}button,input{font:inherit;border:1px solid #ffffff22;border-radius:12px;padding:10px;background:#ffffff0d;color:#fff}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}input{width:100%;margin:8px 0 16px}label{display:block}.tx{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #ffffff17;padding:12px 0}.tx span{overflow-wrap:anywhere}.in{color:#34d399}.out{color:#f87171}.avatar{width:48px;height:48px;border-radius:14px;object-fit:cover;display:grid;place-items:center;background:#fff;color:#08080b}.member{display:flex;align-items:center;gap:12px}.info{flex:1;min-width:0;overflow-wrap:anywhere}.info small{display:block;color:#a0a0ab}.gold{border-color:#d4af37}.silver{border-color:#aaa}.bronze{border-color:#cd7f32}.menu{display:none}#top3{grid-template-columns:repeat(3,1fr);margin-bottom:16px}[hidden]{display:none!important}@media(max-width:900px){.main{margin:0;padding-top:75px}.sidebar{display:none;background:#15151a;z-index:2}.sidebar.open{display:flex}.menu{display:block;position:fixed;top:16px;right:16px;z-index:3}.grid,#top3{grid-template-columns:1fr}}</style></head><body><button id="menu" class="menu" aria-label="فتح القائمة">☰</button><aside id="sidebar" class="sidebar"><b>ZENTRO</b><a href="/dashboard">حسابك</a><a class="active" href="/transfers">التحويلات</a><a href="/top100">Top 100</a><a href="/auth/logout">تسجيل الخروج</a></aside><main class="main"><h1>التحويلات</h1><p id="status" class="muted" role="status">جارٍ التحميل…</p><button id="retry">إعادة التحميل</button><section class="grid"><article class="card"><h3>تحويل جديد</h3><form id="form"><label for="to">معرّف المستلم (Discord ID)</label><input id="to" inputmode="numeric" required><label for="amount">المبلغ (ZC)</label><input id="amount" type="number" min="1" step="any" required><button id="send" disabled>إرسال</button></form></article><article class="card"><h3>آخر العمليات</h3><div id="txs">جارٍ تحميل العمليات…</div></article></section></main><script>
const el=id=>document.getElementById(id);const fmt=value=>Number(value||0).toLocaleString('ar-EG');
async function request(url,options={}){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);try{const response=await fetch(url,{...options,credentials:'same-origin',cache:'no-store',signal:controller.signal});if(response.status===401){location.replace('/auth/login');throw new Error('يلزم تسجيل الدخول')}let data;try{data=await response.json()}catch(error){throw new Error('استجابة غير متوقعة من الخادم: '+response.status)}if(!response.ok)throw new Error(data.error==='write_disabled'?'التحويلات معطّلة من الخادم.':data.error==='configuration_missing'?'إعدادات الخادم غير مكتملة.':'فشل الطلب: '+response.status);return data}catch(error){if(error.name==='AbortError')throw new Error('انتهت مهلة الاتصال. أعد المحاولة.');throw error}finally{clearTimeout(timer)}}
el('menu').onclick=()=>el('sidebar').classList.toggle('open');document.addEventListener('click',event=>{if(!el('sidebar').contains(event.target)&&!el('menu').contains(event.target))el('sidebar').classList.remove('open')});
let user=null,writeDisabled=true,busy=false;
async function load(){el('send').disabled=true;el('status').textContent='جارٍ تحميل بياناتك…';try{const data=await request('/api/me');if(data.guest){location.replace('/auth/login');return}if(!data.user)throw new Error('بيانات الحساب غير مكتملة');user=data.user;writeDisabled=data.writeDisabled===true;el('status').textContent=writeDisabled?'التحويلات معطّلة حاليًا من الخادم؛ سجل العمليات متاح للعرض.':'رصيد المحفظة: '+fmt(user.wallet)+' ZC';el('send').disabled=writeDisabled;await transactions()}catch(error){el('status').textContent=error.message;el('txs').textContent='تعذّر تحميل العمليات.'}}
async function transactions(){try{const rows=await request('/api/transactions');if(!Array.isArray(rows))throw new Error('صيغة العمليات غير متوقعة');el('txs').replaceChildren();if(!rows.length){el('txs').textContent='لا توجد عمليات بعد.';return}rows.slice(0,15).forEach(item=>{const incoming=String(item.recipient_user_id)===String(user.discord_id);const row=document.createElement('div');row.className='tx';const label=document.createElement('span');label.textContent=(incoming?'استلام من ':'إرسال إلى ')+(incoming?item.sender_user_id:item.recipient_user_id);const amount=document.createElement('b');amount.className=incoming?'in':'out';amount.textContent=(incoming?'+':'-')+fmt(item.amount)+' ZC';row.append(label,amount);el('txs').append(row)})}catch(error){el('txs').textContent=error.message}}
el('form').onsubmit=async event=>{event.preventDefault();if(writeDisabled||busy)return;const to=el('to').value.trim();const amount=Number(el('amount').value);if(!/^[0-9]{17,20}$/.test(to)||!Number.isFinite(amount)||amount<=0){el('status').textContent='أدخل معرّف Discord صحيحًا ومبلغًا موجبًا.';return}if(to===String(user.discord_id)){el('status').textContent='لا يمكنك التحويل لنفسك.';return}if(!confirm('تأكيد تحويل '+fmt(amount)+' ZC إلى '+to+'؟'))return;busy=true;el('send').disabled=true;try{await request('/api/transfer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to,amount})});el('form').reset();await load();el('status').textContent='تم تنفيذ التحويل.'}catch(error){el('status').textContent=error.message}finally{busy=false;el('send').disabled=writeDisabled}};
el('retry').onclick=load;load();
</script></body></html>
